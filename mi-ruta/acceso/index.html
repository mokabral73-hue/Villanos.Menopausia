<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso | Mi Ruta D.I.C.H.O.S.A.™</title><style>:root{--v:#65062e;--r:#df2467}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fffaf5,#f9e5df);font-family:Arial;color:#49343b}.wrap{width:min(980px,92%);margin:auto}.logo{width:205px;margin:25px 0}.grid{display:grid;grid-template-columns:1fr 440px;gap:55px;align-items:center;min-height:75vh}h1{font:700 clamp(2.8rem,6vw,5rem) Georgia;color:var(--v);line-height:.95}.ey{color:var(--r);font-weight:800;letter-spacing:.18em;font-size:.78rem;text-transform:uppercase}.card{background:white;border-radius:28px;padding:34px;box-shadow:0 24px 70px #65062e17}.card h2{font:700 2rem Georgia;color:var(--v);margin-top:0}label{display:block;font-weight:700;font-size:.86rem;margin:14px 0 6px}input{width:100%;padding:14px;border:1px solid #e5cfd5;border-radius:12px;font-size:1rem}.passwrap{position:relative}.passwrap input{padding-right:92px}.showpass{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:#fff;color:var(--v);font-weight:700;cursor:pointer;padding:7px}.btn{width:100%;border:0;background:var(--r);color:white;padding:15px;border-radius:999px;font-weight:800;margin-top:20px;cursor:pointer}.switch{background:none;border:0;color:var(--v);font-weight:700;cursor:pointer;margin-top:15px}.msg{font-size:.9rem;margin-top:14px}.hide{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr;gap:20px;padding-bottom:50px}}</style></head><body><div class="wrap"><a href="/"><img class="logo" src="/brand-logo.png?v=20261003" alt="Menopausia Dichosa™"></a><div class="grid"><div><div class="ey">Mi Ruta D.I.C.H.O.S.A.™</div><h1>Tu espacio.<br>Tu proceso.</h1><p>Ingresa para continuar exactamente donde te quedaste y conservar tus descubrimientos a lo largo de los siete pasos.</p></div><div class="card"><h2 id="title">Ingresar</h2><div id="nw" class="hide"><label>Tu nombre</label><input id="name"></div><label>Correo electrónico</label><input id="email" type="email"><label>Contraseña</label><div class="passwrap"><input id="password" type="password"><button type="button" class="showpass" id="showPassword">Ver</button></div><button class="btn" id="submit">Entrar a Mi Ruta</button><button class="switch" id="toggle">¿Es tu primera vez? Crear mi cuenta</button><button class="switch" id="reset">Olvidé mi contraseña</button><div class="msg" id="msg"></div></div></div></div><script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb=createClient("https://rexqlajlgaeleapiqawv.supabase.co","sb_publishable_XpK-kFMWhgViT0Hy7qqeZw_dp8U_fH3"),$=x=>document.getElementById(x);let signup=false;

$("submit").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value,name=$("name").value.trim();if(!email||!password){$("msg").textContent="Escribe tu correo y contraseña.";return}const res=signup?await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin+"/mi-ruta/"}}):await sb.auth.signInWithPassword({email,password});if(res.error){const m=res.error.message||"";$("msg").textContent=/invalid login credentials/i.test(m)?"No pudimos ingresar. Verifica que estés escribiendo el correo electrónico con el que te registraste y tu contraseña.":/already registered|already been registered|user already/i.test(m)?"Este correo ya está registrado. Elige «Ya tengo cuenta · Ingresar».":m;return}if(signup&&!res.data.session){$("msg").innerHTML="<strong>✓ Tu cuenta fue creada.</strong><br>Te enviamos un correo para confirmar tu registro. Después vuelve aquí e ingresa con tu correo y contraseña.";return}if(signup){$("msg").textContent="✓ Tu cuenta quedó creada. Entrando a Mi Ruta…"}location.href="/mi-ruta/"};
$("reset").onclick=async()=>{const email=$("email").value.trim();if(!email){$("msg").textContent="Escribe primero tu correo.";return}const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/mi-ruta/acceso/"});$("msg").textContent=error?error.message:"Te enviamos un enlace para recuperar tu acceso."};
</script></body></html>
