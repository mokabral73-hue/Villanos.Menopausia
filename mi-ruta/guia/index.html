<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de Guía | Menopausia Dichosa™</title><style>:root{--w:#65062e;--r:#df2467;--c:#fffaf5;--l:#ead9df;--m:#806c73}*{box-sizing:border-box}body{margin:0;background:var(--c);font-family:Arial;color:#3d2930}main{width:min(1100px,92%);margin:auto;padding:35px 0 70px}h1,h2{font-family:Georgia;color:var(--w)}h1{font-size:clamp(2.2rem,5vw,4rem)}.card{background:#fff;border:1px solid var(--l);border-radius:22px;padding:22px;margin:14px 0}.person{cursor:pointer}.person:hover{border-color:var(--r)}.stages{display:flex;gap:6px;flex-wrap:wrap}.stage{border-radius:999px;padding:7px 10px;background:#f6edf0}.done{background:#e8f5ed}.muted{color:var(--m)}textarea{width:100%;min-height:100px;padding:12px;border:1px solid var(--l);border-radius:12px}.btn{border:0;border-radius:999px;background:var(--w);color:#fff;padding:11px 17px;font-weight:700;cursor:pointer}.answer{border-left:3px solid var(--r);padding:8px 12px;margin:8px 0;background:#fff8fa}.hidden{display:none}</style></head><body><main><a href="/mi-ruta/" style="color:#65062e">← Mi Ruta</a><h1>Panel de Guía</h1><p class="muted">Aquí aparecen únicamente las participantes que autorizaron acompañamiento.</p><div id="list"></div><section id="detail" class="hidden"></section></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const sb=createClient("https://rexqlajlgaeleapiqawv.supabase.co","sb_publishable_XpK-kFMWhgViT0Hy7qqeZw_dp8U_fH3");const{data:{session}}=await sb.auth.getSession();if(!session){location.replace("/mi-ruta/acceso/");throw 0}const uid=session.user.id;const{data:me}=await sb.from("profiles").select("role").eq("user_id",uid).maybeSingle();if(!["admin","guide"].includes(me?.role)){location.replace("/mi-ruta/");throw 0}const stages=["D","I","C","H","O","S","A"],names={D:"Despierta",I:"Integra",C:"Conecta",H:"Hackea",O:"Optimízate",S:"Sistematiza",A:"Activa"};const{data:people}=await sb.from("profiles").select("user_id,full_name,created_at").eq("role","participant");const list=document.getElementById("list");if(!people?.length)list.innerHTML='<div class="card">Todavía no hay participantes que hayan autorizado acompañamiento.</div>';else{for(const p of people){const{data:pr}=await sb.from("stage_progress").select("stage,status,progress_percent").eq("user_id",p.user_id);const map=Object.fromEntries((pr||[]).map(x=>[x.stage,x]));const el=document.createElement("div");el.className="card person";el.innerHTML="<h2>"+(p.full_name||"Participante")+"</h2><div class=stages>"+stages.map(s=>'<span class="stage '+(map[s]?.status==="completed"?"done":"")+'">'+s+" · "+(map[s]?.status==="completed"?"✓":(map[s]?.progress_percent||0)+"%")+"</span>").join("")+"</div>";el.onclick=()=>openPerson(p);list.appendChild(el)}}async function openPerson(p){const d=document.getElementById("detail");d.classList.remove("hidden");d.innerHTML="<div class=card><h2>"+(p.full_name||"Participante")+"</h2><p>Cargando su Ruta…</p></div>";const[{data:res},{data:chk},{data:notes}]=await Promise.all([sb.from("exercise_responses").select("stage,exercise_key,response,updated_at").eq("user_id",p.user_id).order("stage"),sb.from("evolution_checkins").select("checkpoint,data,created_at").eq("user_id",p.user_id).order("created_at",{ascending:false}),sb.from("facilitator_notes").select("id,note,created_at").eq("participant_user_id",p.user_id).eq("admin_user_id",uid).order("created_at",{ascending:false})]);const esc=x=>String(x??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));const show=x=>x?.text||Object.values(x?.fields||{}).filter(Boolean).join(" · ")||"";d.innerHTML='<div class=card><h2>'+esc(p.full_name||"Participante")+'</h2><h3>Sus respuestas</h3>'+stages.map(s=>'<h3>'+s+" · "+names[s]+'</h3>'+((res||[]).filter(x=>x.stage===s).map(x=>'<div class=answer>'+esc(show(x.response))+'</div>').join("")||'<p class=muted>Sin respuestas todavía.</p>')).join("")+'<h3>Evolución</h3>'+((chk||[]).map(x=>'<div class=answer><b>'+esc(x.checkpoint)+'</b><br>'+esc([x.data?.sostengo,x.data?.cambio,x.data?.ajuste,x.data?.decision].filter(Boolean).join(" · "))+'</div>').join("")||'<p class=muted>Sin revisiones todavía.</p>')+'<h3>Mis notas privadas</h3><textarea id=guideNote placeholder="Escribe una nota privada de seguimiento…"></textarea><br><br><button class=btn id=saveNote>Guardar nota</button><div id=noteStatus></div>'+((notes||[]).map(n=>'<div class=answer>'+esc(n.note)+'</div>').join(""))+'</div>';document.getElementById("saveNote").onclick=async()=>{const note=document.getElementById("guideNote").value.trim(),st=document.getElementById("noteStatus");if(!note)return;const{error}=await sb.from("facilitator_notes").insert({participant_user_id:p.user_id,admin_user_id:uid,note});st.textContent=error?"No se pudo guardar.":"✓ Nota privada guardada.";if(!error)document.getElementById("guideNote").value=""};d.scrollIntoView({behavior:"smooth"})}</script></body></html>
