<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi evolución | Ruta D.I.C.H.O.S.A.™</title><style>:root{--v:#65062e;--r:#df2467;--c:#fffaf5;--b:#ead9df;--t:#3d2930}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font-family:Arial,sans-serif}main{width:min(920px,92%);margin:auto;padding:35px 0 70px}.top{display:flex;justify-content:space-between;align-items:center}.logo{width:205px}.back{color:var(--v);font-weight:700;text-decoration:none}.hero{padding:40px 0 15px}.ey{color:var(--r);font-weight:800;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem}h1{font:700 clamp(3rem,6vw,4.8rem) Georgia;color:var(--v);margin:10px 0}.lead{font:1.1rem/1.6 Georgia}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--b);border-radius:22px;padding:22px}.card h2{font:700 1.6rem Georgia;color:var(--v)}label{font-weight:700;color:var(--v);font-size:.9rem}textarea{width:100%;min-height:110px;border:1px solid var(--b);border-radius:13px;padding:12px;margin:6px 0 14px;font:1rem Arial}.btn{border:0;background:var(--r);color:#fff;padding:13px 22px;border-radius:999px;font-weight:800;cursor:pointer}.status{display:block;margin-top:12px;color:#846b74;font-size:.9rem}.notice{margin:20px 0;background:#fff3f7;border-left:4px solid var(--r);padding:14px;border-radius:10px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><a href="/mi-ruta/"><img class="logo" src="/brand-logo.png?v=20261003"></a><a class="back" href="/mi-ruta/">← Mi Ruta</a></div><section class="hero"><div class="ey">Autoobservación</div><h1>Mi evolución</h1><p class="lead">Inicio → Proceso → Hoy. No compares tu camino con el de otra mujer; úsalo para reconocer tus propios cambios.</p></section><div class="notice">Registra percepciones personales, no diagnósticos. Si algo de tu salud te preocupa, consulta a un profesional de salud.</div><div class="grid" id="grid"></div></main><script type="module">import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";const sb=createClient("https://rexqlajlgaeleapiqawv.supabase.co","sb_publishable_XpK-kFMWhgViT0Hy7qqeZw_dp8U_fH3");const{data:{session}}=await sb.auth.getSession();if(!session){location.replace("/mi-ruta/acceso/");throw 0}const uid=session.user.id,defs=[["inicio","Inicio","¿Cómo me siento y qué quiero observar al comenzar?"],["proceso","Proceso","¿Qué estoy descubriendo o haciendo diferente?"],["hoy","Hoy","¿Qué reconozco diferente en mí ahora?"]],grid=document.getElementById("grid");grid.innerHTML=defs.map(d=>'<section class="card"><div class="ey">'+d[1]+'</div><h2>'+d[2]+'</h2><label>Mi energía (1–10)</label><textarea id="'+d[0]+'-energy" placeholder="Escribe un número y, si quieres, explica por qué…"></textarea><label>Lo que observo</label><textarea id="'+d[0]+'-note" placeholder="Mis señales, emociones, hábitos o aprendizajes…"></textarea><button class="btn" data-save="'+d[0]+'">Guardar '+d[1]+'</button><span class="status" id="'+d[0]+'-status"></span></section>').join("");const{data}=await sb.from("evolution_checkins").select("checkpoint,data,created_at").eq("user_id",uid).order("created_at",{ascending:false});for(const d of defs){const x=(data||[]).find(r=>r.checkpoint===d[0]);if(x){document.getElementById(d[0]+"-energy").value=x.data?.energy||"";document.getElementById(d[0]+"-note").value=x.data?.note||""}}document.querySelectorAll("[data-save]").forEach(b=>b.onclick=async()=>{const k=b.dataset.save,s=document.getElementById(k+"-status");s.textContent="Guardando…";const{error}=await sb.from("evolution_checkins").insert({user_id:uid,checkpoint:k,data:{energy:document.getElementById(k+"-energy").value.trim(),note:document.getElementById(k+"-note").value.trim()}});s.textContent=error?"No se pudo guardar.":"✓ Guardado en tu evolución"});</script></body></html>
