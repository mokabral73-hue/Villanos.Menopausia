name: Configura OG Embajadoras

on:
  push:
    branches:
      - main
    paths:
      - embajadoras/index.html
      - .github/workflows/og-embajadoras.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agregar metadatos OG de Embajadoras
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('embajadoras/index.html')
          html = p.read_text(encoding='utf-8')

          block = '''<meta property="og:type" content="website">
<meta property="og:site_name" content="Menopausia Dichosa®">
<meta property="og:title" content="Embajadoras Menopausia Dichosa® | Aprende, acompaña e inspira">
<meta property="og:description" content="Conoce la propuesta de Embajadoras Menopausia Dichosa® o ingresa al Centro de Embajadoras.">
<meta property="og:url" content="https://menopausiadichosa.com/embajadoras/">
<meta property="og:image" content="https://menopausiadichosa.com/embajadoras/assets/embajadoras-whatsapp.jpg?v=20260912">
<meta property="og:image:secure_url" content="https://menopausiadichosa.com/embajadoras/assets/embajadoras-whatsapp.jpg?v=20260912">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Embajadoras Menopausia Dichosa® — Aprende, acompaña e inspira">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Embajadoras Menopausia Dichosa® | Aprende, acompaña e inspira">
<meta name="twitter:description" content="Conoce la propuesta de Embajadoras Menopausia Dichosa® o ingresa al Centro de Embajadoras.">
<meta name="twitter:image" content="https://menopausiadichosa.com/embajadoras/assets/embajadoras-whatsapp.jpg?v=20260912">'''

          canonical = '<link rel="canonical" href="https://menopausiadichosa.com/embajadoras/">'
          if '<meta property="og:title"' in html:
              start = html.index('<meta property="og:type"') if '<meta property="og:type"' in html else html.index('<meta property="og:title"')
              end = html.index('<style>', start)
              html = html[:start] + block + '\n' + html[end:]
          else:
              html = html.replace(canonical, canonical + '\n' + block)

          p.write_text(html, encoding='utf-8')
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add embajadoras/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Configura OG de Embajadoras para WhatsApp"
            git push
          fi
