name: Usa imagen original OG ficha

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/og-ficha.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Usar imagen original de la ficha
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ficha/index.html')
          html = p.read_text(encoding='utf-8')
          old = 'https://menopausiadichosa.com/ficha/ficha-whatsapp.jpg?v=20260912'
          new = 'https://menopausiadichosa.com/ficha/WhatsApp%20Image%202026-08-18%20at%2022.36.01.jpeg?v=20260912-original'
          html = html.replace(old, new)
          html = html.replace('<meta property="og:image:width" content="1200">\n', '')
          html = html.replace('<meta property="og:image:height" content="630">\n', '')
          p.write_text(html, encoding='utf-8')
          PY
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ficha/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "[og-ficha] Usa imagen original aprobada"
            git push
          fi
