name: Ajustar video de portada

on:
  push:
    paths:
      - '.github/workflows/add-home-video.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hacer el video compacto y casi cuadrado
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '.mediaMomentVideo{width:220px;max-width:100%;margin:auto;border-radius:22px;overflow:hidden;background:#f5dce2;box-shadow:0 12px 30px rgba(121,20,55,.13)}.mediaMomentVideo video{display:block;width:100%;height:auto;aspect-ratio:9/16;object-fit:cover}'
          new = '.mediaMomentVideo{width:220px;height:220px;max-width:100%;margin:auto;border-radius:22px;overflow:hidden;background:#f5dce2;box-shadow:0 12px 30px rgba(121,20,55,.13)}.mediaMomentVideo video{display:block;width:100%;height:100%;aspect-ratio:1/1;object-fit:cover}'
          if old not in s:
              raise SystemExit('No se encontró el estilo actual del video; no se modificó nada.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar ajuste
        shell: bash
        run: |
          git config user.name 'mokabral73-hue'
          git config user.email 'mokabral73@gmail.com'
          git add index.html
          git commit -m 'Ajusta video de portada a formato compacto cuadrado'
          git push origin HEAD:main
