name: Actualizar páginas de eventos
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generar páginas desde el calendario
        run: python3 scripts/generate_event_pages.py
      - name: Publicar cambios
        run: |
          git config user.name "Menopausia Dichosa Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos/
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar páginas públicas de eventos"
            git push
          fi
