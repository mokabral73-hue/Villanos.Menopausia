<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los Villanos de la Menopausia – Menopausia Dichosa</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Nunito', sans-serif; background: #fff9f9; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 1rem; }
.app { width: 100%; max-width: 600px; padding: 1.5rem 1.2rem 3rem; }
.logo-wrap { text-align: center; margin-bottom: 1rem; }
.logo-wrap img { height: 90px; object-fit: contain; }
.app-title { font-family: 'Bangers', cursive; font-size: 2.4rem; letter-spacing: 2px; color: #1a1a1a; text-align: center; line-height: 1.1; }
.app-sub { font-size: 0.92rem; color: #666; text-align: center; margin-top: 0.3rem; margin-bottom: 1.4rem; }
.prog-bar { background: #f0e8e8; border-radius: 20px; height: 8px; margin-bottom: 0.4rem; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg,#C0112B,#D85A30); transition: width 0.4s; }
.step-lbl { font-size: 0.75rem; color: #999; text-align: right; margin-bottom: 1rem; }
.q-card { background: #fff; border: 1px solid #f0d8d8; border-radius: 16px; padding: 1.2rem; margin-bottom: 1rem; box-shadow: 0 2px 12px rgba(192,17,43,0.07); }
.q-icon { font-size: 1.5rem; margin-bottom: 0.2rem; }
.q-text { font-size: 1.02rem; font-weight: 700; color: #1a1a1a; margin-bottom: 1rem; line-height: 1.4; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opt { background: #fdf5f5; border: 1.5px solid #e8c8c8; border-radius: 10px; padding: 10px 11px; font-family: 'Nunito',sans-serif; font-size: 0.85rem; font-weight: 600; color: #333; cursor: pointer; text-align: left; transition: all 0.15s; line-height: 1.3; }
.opt:hover { border-color: #C0112B; background: #fff0f0; }
.opt.sel { border-color: #C0112B; background: #fff; color: #C0112B; box-shadow: 0 0 0 2px rgba(192,17,43,0.15); }
.opt-e { display: block; font-size: 1.1rem; margin-bottom: 3px; }
.navs { display: flex; gap: 9px; margin-top: 0.5rem; }
.btn-nxt { flex: 1; background: #C0112B; color: #fff; border: none; border-radius: 10px; padding: 12px; font-family: 'Nunito',sans-serif; font-size: 1rem; font-weight: 800; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
.btn-nxt:hover { opacity: 0.88; }
.btn-nxt:active { transform: scale(0.98); }
.btn-nxt:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-bk { background: #f5f5f5; color: #888; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px 16px; font-family: 'Nunito',sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
.btn-bk:hover { background: #eee; }
.res { display: none; }
.vil-reveal { text-align: center; padding: 1.5rem 1rem 1.2rem; border: 1px solid #f0d8d8; border-radius: 16px; background: #fff; margin-bottom: 1rem; box-shadow: 0 2px 12px rgba(192,17,43,0.07); }
.vil-big-e { font-size: 4rem; display: block; margin-bottom: 0.4rem; animation: pop 0.5s ease; }
.vil-big-img { max-width: 220px; max-height: 240px; width: auto; height: auto; object-fit: contain; display: block; margin: 0 auto 0.2rem; animation: pop 0.5s ease; }
.bar-avatar { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px; }
@keyframes pop { 0%{transform:scale(0.4);opacity:0} 70%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
.vil-big-n { font-family: 'Bangers',cursive; font-size: 2rem; letter-spacing: 2px; color: #1a1a1a; }
.vil-tag { font-size: 0.87rem; color: #888; margin-top: 0.3rem; font-style: italic; }
.bars { display: flex; flex-direction: column; gap: 8px; margin: 1.2rem 0 0.4rem; text-align: left; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-lbl { width: 150px; flex-shrink: 0; color: #666; font-weight: 600; font-size: 0.72rem; line-height: 1.15; }
.bar-track { flex: 1; height: 7px; background: #f0e8e8; border-radius: 10px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 10px; transition: width 1s ease; }
.bp { border: 1px solid #f0d8d8; border-radius: 16px; overflow: hidden; margin-bottom: 1rem; background: #fff; }
.bp-sec { padding: 1rem 1.2rem; border-bottom: 1px solid #f0e8e8; }
.bp-sec:last-child { border-bottom: none; }
.bp-ttl { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 0.7rem; }
.wp-list { display: flex; flex-direction: column; gap: 8px; }
.wp { display: flex; align-items: flex-start; gap: 10px; font-size: 0.87rem; line-height: 1.4; }
.wp-ic { font-size: 1.1rem; flex-shrink: 0; margin-top: 1px; }
.wp-n { font-weight: 700; color: #1a1a1a; }
.wp-d { color: #777; font-size: 0.81rem; margin-top: 1px; }
.tag-base { display: inline-block; background: #fff0f2; color: #C0112B; border: 1px solid #f0c0c8; border-radius: 5px; font-size: 0.65rem; font-weight: 800; padding: 1px 6px; margin-left: 5px; vertical-align: middle; letter-spacing: 0.5px; text-transform: uppercase; }
.chip { display: inline-block; background: #e8f4ff; color: #1a6db0; border-radius: 20px; padding: 4px 12px; font-size: 0.79rem; font-weight: 600; margin: 3px 3px 0 0; }
.btn-wa { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #25D366; color: #fff; border: none; border-radius: 12px; padding: 14px; font-family: 'Nunito',sans-serif; font-size: 1.02rem; font-weight: 800; cursor: pointer; margin-bottom: 0.7rem; transition: opacity 0.15s, transform 0.1s; }
.btn-wa:hover { opacity: 0.9; }
.btn-wa:active { transform: scale(0.98); }
.wa-icon { width: 24px; height: 24px; flex-shrink: 0; }
.btn-rst { width: 100%; background: #f5f5f5; border: 1px solid #e0e0e0; border-radius: 10px; padding: 12px; font-family: 'Nunito',sans-serif; font-size: 0.9rem; font-weight: 700; color: #888; cursor: pointer; }
.btn-rst:hover { background: #eee; }
.sc-coral{background:#D85A30}.sc-purple{background:#7F77DD}.sc-pink{background:#C0112B}
.sc-amber{background:#BA7517}.sc-teal{background:#1D9E75}.sc-blue{background:#378ADD}.sc-green{background:#639922}
.sc-brown{background:#8B5E3C}.sc-gold{background:#D4A017}.sc-maroon{background:#9E2A2B}.sc-slate{background:#3D7A7A}
@media(max-width:480px){ .opts{grid-template-columns:1fr;} .app-title{font-size:2rem;} }
</style>
</head>
<body>
<div class="app">
  <div class="logo-wrap">
    <img src="/brand-logo.png" alt="Menopausia Dichosa®">
  </div>
  <div class="app-title">Los Villanos de la Menopausia</div>
  <div class="app-sub">Descubre cuál te está atacando y arma tu plan de batalla</div>

  <div id="quiz-screen">
    <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>

function render(){
  const q=Qs[cur];
  document.getElementById('prog').style.width=Math.round((cur/Qs.length)*100)+'%';
  document.getElementById('step-lbl').textContent=`Pregunta ${cur+1} de ${Qs.length}`;
  document.getElementById('q-icon').textContent=q.icon;
  document.getElementById('q-text').textContent=q.text;
  const g=document.getElementById('opts'); g.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(ans[cur]===i?' sel':'');
    b.innerHTML=`<span class="opt-e">${o.e}</span>${o.t}`;
    b.onclick=()=>pick(i);
    g.appendChild(b);
  });
  document.getElementById('btn-bk').style.display=cur===0?'none':'block';
  document.getElementById('btn-nxt').disabled=ans[cur]===undefined;
  document.getElementById('btn-nxt').textContent=cur===Qs.length-1?'Ver mi villano →':'Siguiente →';
}

function pick(i){
  ans[cur]=i;
  document.querySelectorAll('.opt').forEach((b,idx)=>b.classList.toggle('sel',idx===i));
  document.getElementById('btn-nxt').disabled=false;
}

function goNext(){ if(ans[cur]===undefined)return; cur++; cur>=Qs.length?showRes():render(); }
function goBack(){ if(cur>0){cur--;render();} }

function showRes(){
  scores={calor:0,insomnio:0,humor:0,energia:0,piel:0,libido:0,peso:0,memoria:0,oxidada:0,histaminica:0,silencioso:0,inflado:0};
  ans.forEach((a,qi)=>{
    Object.entries(Qs[qi].opts[a].v).forEach(([k,val])=>{ if(scores[k]!==undefined) scores[k]=Math.max(0,scores[k]+val); });
  });
  const maxScore=Math.max(...Object.values(scores));
  const tied=Object.keys(scores).filter(k=>scores[k]===maxScore);
  const top=tied[Math.floor(Math.random()*tied.length)];
  const vil=VIL[top];
  const maxS=Math.max(...Object.values(scores))||1;

  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('res').style.display='block';
  document.getElementById('res-e').textContent=vil.emoji;
  document.getElementById('res-img').src=VIMGFULL[top];
  document.getElementById('res-img').alt=vil.name;
  document.getElementById('res-n').textContent=vil.name;
  document.getElementById('res-tag').textContent=vil.tag;

  const ord=[
    {k:'calor',l:'El Incendiario',c:'coral'},{k:'insomnio',l:'El Insomniaco',c:'purple'},
    {k:'humor',l:'Montaña Rusa',c:'pink'},{k:'energia',l:'Vampiro de Energía',c:'amber'},
    {k:'piel',l:'Ladrón de Colágeno',c:'teal'},{k:'libido',l:'El Apagafuegos',c:'blue'},
    {k:'peso',l:'El Acumulador',c:'green'},{k:'memoria',l:'Niebla Mental',c:'amber'},
    {k:'oxidada',l:'La Oxidada',c:'brown'},{k:'histaminica',l:'La Histamínica',c:'gold'},{k:'silencioso',l:'El Silencioso',c:'maroon'},{k:'inflado',l:'El Inflado',c:'slate'}
  ];
  const bEl=document.getElementById('bars'); bEl.innerHTML='';
  ord.forEach(v=>{
    const pct=Math.round((scores[v.k]/(maxS+1))*100);
    const r=document.createElement('div'); r.className='bar-row';
    r.innerHTML=`<span class="bar-lbl"><img class="bar-avatar" src="${VIMG[v.k]}" alt="">${v.l}</span><div class="bar-track"><div class="bar-fill sc-${v.c}" style="width:0%" id="bf-${v.k}"></div></div>`;
    bEl.appendChild(r);
    setTimeout(()=>{ document.getElementById('bf-'+v.k).style.width=pct+'%'; },250);
  });

  document.getElementById('bp').innerHTML=`
    <div class="bp-sec">
      <div class="bp-ttl" style="color:${vil.hex}">🔍 Qué está pasando en tu cuerpo</div>
      <div class="wp"><span class="wp-ic">💡</span><div><div class="wp-d">${vil.causa}</div></div></div>
    </div>
    <div class="bp-sec">
      <div class="bp-ttl" style="color:${vil.hex}">🏆 Hábitos que lo derrotan</div>
      <div>${vil.hab.map(h=>`<span class="chip">${h}</span>`).join('')}</div>
    </div>
    <div class="bp-sec">
      <div class="bp-ttl" style="color:${vil.hex}">🌟 Tu protocolo prioritario</div>
      <div class="wp"><span class="wp-ic">🔒</span><div>
        <div class="wp-n">Personalizado según tu caso</div>
        <div class="wp-d">🌷 Este es tu primer paso. Los otros dos dependen de tu caso específico — agenda tu sesión de diagnóstico de 20 min conmigo, sin costo.</div>
      </div></div>
    </div>`;

  waMsg=encodeURIComponent(`¡Hola Mony! Hice el quiz de Los Villanos de la Menopausia y mi villano principal es "${vil.name}" ${vil.emoji}. Quiero saber cómo revertirlo — ¿me ayudas a agendar mi sesión de diagnóstico? 🌹`);
}

  document.getElementById('quiz-screen').style.display='block';

}
