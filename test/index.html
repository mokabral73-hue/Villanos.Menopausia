<body>
  <iframe id="testFrame" src="./test:index.html?v=20260825b" title="Test de los Villanos de la Menopausia" scrolling="no"></iframe>
  <script>
    const frame=document.getElementById('testFrame');
    function resizeFrame(){try{const d=frame.contentDocument;if(!d)return;const h=Math.max(d.documentElement?d.documentElement.scrollHeight:0,d.body?d.body.scrollHeight:0,window.innerHeight);frame.style.height=h+'px';}catch(e){}}
    function installTracking(){
      try{
        const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d||w.__gaHooksInstalled)return;w.__gaHooksInstalled=true;
        let started=false,completed=false;
        d.addEventListener('click',function(e){
          const target=e.target;
          if(!started&&target.closest&&target.closest('.opt')){started=true;gtag('event','test_start',{page_section:'test'});}
          const waButton=target.closest&&target.closest('.btn-wa');
          if(waButton){
            let villain='';try{villain=d.getElementById('res-n')?.textContent?.trim()||'';}catch(err){}
            gtag('event','whatsapp_result_click',{villain:villain,page_section:'test',transport_type:'beacon'});
          }
        },true);
        const resultEl=d.getElementById('res');
        if(resultEl){
          const resultObserver=new MutationObserver(function(){
            if(!completed&&resultEl.style.display==='block'){
              completed=true;let villain='';try{villain=d.getElementById('res-n')?.textContent?.trim()||'';}catch(err){}
              gtag('event','test_complete',{villain:villain,page_section:'test'});
            }
            resizeFrame();
          });
          resultObserver.observe(resultEl,{attributes:true,attributeFilter:['style']});
        }
        const observer=new MutationObserver(resizeFrame);observer.observe(d.documentElement,{subtree:true,childList:true,attributes:true});resizeFrame();
      }catch(e){}
    }
    frame.addEventListener('load',function(){installTracking();resizeFrame();setTimeout(resizeFrame,300);setTimeout(resizeFrame,1000);});
    window.addEventListener('resize',resizeFrame);
  </script>
