<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#302632;background:#fffafc}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#a2175c}.shell{max-width:1140px;margin:auto;padding:28px 24px}.brand{display:flex;align-items:center;gap:20px}.brand img{width:170px;height:auto}.brand span{color:#765b6b}.layout{display:grid;grid-template-columns:1fr 1fr;gap:7%;align-items:start;margin-top:80px}.intro{padding-top:32px}.eyebrow{font-size:13px;letter-spacing:.18em;color:#ab2164;font-weight:800}.intro h1{font:normal clamp(39px,5vw,68px)/1.1 Georgia,serif;letter-spacing:-.04em;margin:23px 0}.intro p{font-size:19px;line-height:1.55;color:#684d5d;max-width:490px}.accent{display:flex;align-items:center;gap:12px;color:#8c4670;border-top:1px solid #edd7e1;padding-top:27px;margin-top:42px;font-size:14px;flex-wrap:wrap}.accent b{font:normal 22px Georgia,serif;color:#c82a77}.panel{background:#fff;border:1px solid #efd7e2;box-shadow:0 20px 55px #74204b12;border-radius:22px;padding:30px}.panel h2{font:normal 30px Georgia,serif;margin:0 0 22px}.event-list{display:grid;gap:10px}.event{width:100%;border:1px solid #ead6e1;border-radius:14px;background:#fff;display:flex;align-items:center;text-align:left;padding:13px;gap:15px;color:#3c2a36}.event.selected{background:#fff2f8;border:2px solid #c43278;padding:12px}.event:disabled{opacity:.5;cursor:not-allowed}.event img{width:72px;height:86px;object-fit:cover;border-radius:9px;flex:none}.date{background:#f9e7f0;color:#a21c60;padding:12px 8px;border-radius:9px;text-align:center;min-width:58px;font-weight:bold}.event strong,.event small{display:block}.event small{margin-top:5px;color:#725e6c}.dot{margin-left:auto;color:#bb2870}.address{font-size:14px;color:#705465;line-height:1.4;margin:18px 0 26px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:16px}label{display:block;font-weight:600;font-size:14px;margin-bottom:8px}input{width:100%;height:46px;border:1px solid #dfc4d2;border-radius:9px;padding:10px 12px;background:white}.optional{font-weight:normal;color:#897484}.privacy{font-size:13px;color:#786573;line-height:1.4}.primary{width:100%;background:#b51e68;color:#fff;min-height:49px;font-size:16px;border:0;border-radius:8px}.primary:disabled{opacity:.7}.error{color:#a21b3a;background:#fff0f3;padding:12px;border-radius:9px}footer{color:#947b89;font-size:13px;margin-top:90px;text-align:center}.ticket-page{max-width:610px;margin:40px auto;padding:20px;text-align:center}.ticket-brand{width:180px;height:auto;margin:0 auto 25px}.ticket{background:#fff;border:1px solid #eecedc;border-radius:24px;overflow:hidden;box-shadow:0 22px 65px #7e245019;text-align:left}.ticket-top{background:#ad2168;color:white;padding:34px}.ticket-top small{letter-spacing:.12em;font-weight:bold}.ticket-top h1{font:normal 35px/1.15 Georgia,serif;margin:20px 0}.ticket-top p{margin:0}.ticket-body{padding:28px 34px}.ticket-promo{display:block;width:100%;max-height:430px;object-fit:contain;margin:0 auto 24px;border-radius:11px;background:#fff6fa}.ticket-code{text-align:center;letter-spacing:.1em;font-size:32px;font-weight:bold;color:#a61d61;border:2px dashed #d892b5;padding:18px;border-radius:12px}.hint{text-align:center;color:#7c6473;font-size:14px}.ticket dl{margin-top:26px}.ticket dl div{padding:13px 0;border-top:1px solid #f1dfe8}.ticket dt{font-size:13px;color:#886979;text-transform:uppercase;letter-spacing:.07em}.ticket dd{margin:5px 0 0;font-weight:600;line-height:1.5}.actions{display:flex;gap:10px;justify-content:center;margin:22px 0}.actions button{padding:12px 20px;border-radius:9px;border:1px solid #ca6a99;background:#fff;color:#9a1d5b}.actions button:first-child{background:#b51e68;color:white;border-color:#b51e68}.back{display:inline-block;margin-top:12px}.ticket-calendar{border-top:1px solid #f1dfe8;padding-top:18px;margin-top:8px}.ticket-calendar strong{display:block;color:#693c57;margin-bottom:12px}.calendar-links{display:flex;gap:9px;flex-wrap:wrap}.calendar-links a,.calendar-links button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:10px 13px;border:1px solid #ca6a99;border-radius:8px;background:#fff;color:#9a1d5b;font-size:14px}.calendar-note{font-size:13px;line-height:1.4;color:#786573;margin:12px 0 0}.site-link{border-top:1px solid #f1dfe8;padding-top:17px;margin-top:22px;line-height:1.5}.site-link a{font-weight:700}.arrived{color:#276143;font-weight:bold;text-align:center}@media(max-width:760px){.layout{grid-template-columns:1fr;margin-top:25px;gap:22px}.intro{padding-top:8px}.intro h1{margin:14px 0;font-size:42px}.intro p{font-size:16px}.accent{margin-top:20px;padding-top:16px}.panel{padding:21px}.shell{padding:18px}.fields{grid-template-columns:1fr}.actions{flex-wrap:wrap}.brand img{width:132px}.brand span{font-size:14px}.event img{width:56px;height:72px}.date{min-width:48px}}@media print{body{background:#fff}.ticket-page{margin:0}.actions,.back{display:none}.ticket{box-shadow:none}}
 .ticket-qr{display:flex;justify-content:center;margin:15px auto 8px}.ticket-qr img,.ticket-qr canvas{padding:8px;background:white;border:1px solid #f1dfe8;border-radius:8px;width:176px;height:176px}
.payment-box{background:#fff2f8;border:1px solid #e6bad0;border-radius:14px;padding:16px;margin:18px 0}.payment-box strong{color:#92245a}.payment-box p{line-height:1.5;color:#66505f}.payment-cta{display:inline-block;padding:12px 18px;background:#ad2168;color:#fff;border-radius:10px;text-decoration:none;font-weight:700;margin:10px 0}.pending-page{max-width:610px;margin:36px auto;padding:22px}.pending-card{padding:26px;background:#fff;border:1px solid #ead1df;border-radius:18px;line-height:1.55}.pending-card h1{font:normal 32px Georgia,serif;color:#9b205d}.pending-card input{width:100%;margin:7px 0 15px;padding:11px;border:1px solid #dfc4d2;border-radius:9px}.pending-card label{display:block;font-weight:700}.pending-card button{border:0;border-radius:9px;background:#ad2168;color:#fff;padding:12px 16px;font-weight:700}.payment-price{display:block;color:#a21d63;font-size:14px;font-weight:700;margin-top:6px}
</style>
</head>
<body><div id="app" aria-live="polite"></div>
<script src="/boletos/vendor/qrcode.min.js"></script>
<script>
(() => {
  'use strict';
  const api = 'https://boletos-menopausia-dichosa.menopausiadichosa.chatgpt.site';
  const root = document.getElementById('app');
  const escape = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const date = value => new Date(value + 'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'});
  const fullDate = value => new Date(value + 'T12:00:00').toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const promo = event => api + '/api/events/' + encodeURIComponent(event.id || event.eventId) + '/image';
  async function request(path, options) {
    const response = await fetch(api + path, options);
    const result = await response.json();
    if (!response.ok) throw Error(result.error || 'Inténtalo nuevamente.');
    return result;
  }
  function brand(subtitle) {return '<header class="brand"><img src="/brand-logo.png" alt="Menopausia Dichosa®"><span>'+subtitle+'</span></header>'}
  let events = [], selected = '';
  function renderHome(message = '') {
    const event=events.find(item=>item.id===selected);
    const paid=event&&event.price_cents>0;
    const price=item=>(item.price_cents/100).toLocaleString('es-MX',{style:'currency',currency:'MXN'});
    const cards=events.map(item=>'<button type="button" class="event '+(item.id===selected?'selected':'')+'" data-event="'+escape(item.id)+'"><span class="date">'+escape(date(item.date))+'</span><span><strong>'+escape(item.title)+'</strong><small>'+escape(item.time)+' h · '+escape(item.place)+'</small>'+(item.price_cents?'<span class="payment-price">'+escape(price(item))+'</span>':'')+'</span><span class="dot">'+(item.id===selected?'●':'○')+'</span></button>').join('');
    const payment=paid?'<div class="payment-box"><strong>Acceso: '+escape(price(event))+'</strong><p>Primero aparta tu lugar. Después podrás abrir Mercado Pago y enviar la referencia para que Mony confirme el pago.</p></div>':'';
    const form=event&&event.active&&event.available>0?payment+'<form id="reservation"><div class="fields"><div class="field"><label for="name">Tu nombre</label><input id="name" name="name" required minlength="3" placeholder="Nombre y apellido"></div><div class="field"><label for="phone">WhatsApp</label><input id="phone" name="phone" required type="tel" inputmode="tel" placeholder="10 dígitos"></div></div><div class="field"><label for="concern">¿Qué te gustaría entender mejor? <span class="optional">Opcional</span></label><input id="concern" name="concern" placeholder="Sueño, energía, emociones…"></div><p class="privacy">Usaremos tu WhatsApp solo para coordinar esta reserva. '+(paid?'Tu lugar se aparta ahora; el boleto se habilita cuando confirmemos el pago.':'Guarda tu boleto al terminar.')+'</p><p class="error" id="form-error" role="alert" '+(message?'':'hidden')+'>'+escape(message)+'</p><button class="primary" type="submit">'+(paid?'Apartar lugar y continuar al pago':'Reservar mi lugar')+'</button></form>':event?'<p>'+(event.available<=0?'Lugares agotados.':'Las reservas están cerradas.')+'</p>':'';
    root.innerHTML='<main class="shell">'+brand('Villanos en la Menopausia')+'<div class="layout"><section class="intro"><div class="eyebrow">PRÓXIMOS EVENTOS</div><h1>Elige tu encuentro.</h1><p>Conoce los detalles y reserva tu lugar.</p></section><section class="panel"><h2>Elige tu sesión</h2>'+(events.length?'<div class="event-list">'+cards+'</div>':'<p>Aún no hay sesiones abiertas. Vuelve pronto.</p>')+(event?'<p class="address">'+(event.online?'💻 En línea · El enlace de acceso estará en tu boleto confirmado':'📍 '+escape(event.address))+(event.location_url?' · <a href="'+escape(event.location_url)+'" target="_blank" rel="noopener noreferrer">Abrir ubicación</a>':'')+'</p>'+(event.description?'<p>'+escape(event.description)+'</p>':'')+form:'')+'</section></div><footer>Menopausia Dichosa®</footer></main>';
    root.querySelectorAll('[data-event]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.event;history.replaceState(null,'','/boletos/?evento='+encodeURIComponent(selected));renderHome()}));
    root.querySelector('#reservation')?.addEventListener('submit',async e=>{
      e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;button.textContent='Registrando…';const fields=new FormData(form);
      try{const result=await request('/api/reserve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({eventId:selected,name:fields.get('name'),phone:fields.get('phone'),concern:fields.get('concern'),paymentReference:null})});history.pushState(null,'','/boletos/?boleto='+encodeURIComponent(result.code));await renderTicket(result.code)}
      catch(error){const field=form.querySelector('#form-error');field.hidden=false;field.textContent=error.message;button.disabled=false;button.textContent=paid?'Apartar lugar y continuar al pago':'Reservar mi lugar'}
    });
  }
  async function renderTicket(code) {
    root.innerHTML='<main class="ticket-page"><p>Cargando boleto…</p></main>';
    try {
      const ticket=await request('/api/ticket/'+encodeURIComponent(code));
      if(ticket.paymentStatus==='pending'){
        root.innerHTML='<main class="pending-page">'+brand('Confirmación de pago')+'<section class="pending-card"><h1>Tu lugar está apartado</h1><p>Tu solicitud para <strong>'+escape(ticket.title)+'</strong> es <strong>'+escape(ticket.code)+'</strong>. Aún no es un boleto de acceso.</p><p>Acceso: <strong>'+(ticket.priceCents/100).toLocaleString('es-MX',{style:'currency',currency:'MXN'})+'</strong>. Paga con el enlace de Mercado Pago y regresa a esta página para enviar tu referencia.</p>'+(ticket.paymentUrl?'<a class="payment-cta" href="'+escape(ticket.paymentUrl)+'" target="_blank" rel="noopener noreferrer">Pagar con Mercado Pago ↗</a>':'')+(ticket.referenceReceived?'<p class="payment-confirmed">Referencia recibida. Mony verificará el pago en Mercado Pago y habilitará tu boleto.</p>':'<form id="reference-form"><label for="payment-phone">Tu WhatsApp de la reserva</label><input id="payment-phone" type="tel" name="phone" inputmode="tel" required placeholder="10 dígitos"><label for="payment-reference">Referencia de pago</label><input id="payment-reference" name="reference" required minlength="4" placeholder="Número de operación o referencia"><p class="error" id="reference-error" hidden></p><button type="submit">Enviar referencia</button></form>')+'<p>Guarda el enlace de esta página. El boleto y el acceso al evento en línea aparecerán aquí cuando se confirme el pago.</p><p><button id="check-payment" type="button">Revisar estado</button></p></section></main>';
        root.querySelector('#check-payment').onclick=()=>renderTicket(code);
        root.querySelector('#reference-form')?.addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button');button.disabled=true;const fields=new FormData(form);try{await request('/api/payment-reference',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,phone:fields.get('phone'),reference:fields.get('reference')})});await renderTicket(code)}catch(error){const box=form.querySelector('#reference-error');box.hidden=false;box.textContent=error.message;button.disabled=false}});
        return;
      }
      root.innerHTML='<main class="ticket-page"><img class="ticket-brand" src="/brand-logo.png" alt="Menopausia Dichosa®"><article class="ticket"><div class="ticket-top"><small>BOLETO PERSONAL · VILLANOS EN LA MENOPAUSIA</small><h1>¡Tu lugar está reservado, '+escape(ticket.name.split(' ')[0])+'!</h1><p>Te esperamos para vivir esta sesión juntas.</p></div><div class="ticket-body">'+(ticket.imageKey?'<img class="ticket-promo" src="'+promo(ticket)+'" alt="Promocional de '+escape(ticket.title)+'">':'')+'<div class="ticket-code">'+escape(ticket.code)+'</div><div id="ticket-qr" class="ticket-qr" aria-label="Código QR de acceso"></div><p class="hint">'+(ticket.address==='Evento en línea'?'Tu código confirma tu acceso al evento':'Presenta este código al llegar')+'</p><dl><div><dt>Sesión</dt><dd>'+escape(ticket.title)+'</dd></div><div><dt>Fecha y hora</dt><dd>'+escape(fullDate(ticket.date))+' · '+escape(ticket.time)+' h</dd></div><div><dt>'+(ticket.address==='Evento en línea'?'Acceso en línea':'Lugar')+'</dt><dd>'+escape(ticket.place)+(ticket.address==='Evento en línea'?'':'<br>'+escape(ticket.address))+(ticket.locationUrl?'<br><a href="'+escape(ticket.locationUrl)+'" target="_blank" rel="noopener noreferrer">'+(ticket.address==='Evento en línea'?'Entrar al evento':'Abrir ubicación')+'</a>':'')+'</dd></div></dl><div class="ticket-calendar"><strong>Agenda esta sesión</strong><div class="calendar-links"><a id="google-calendar" target="_blank" rel="noopener noreferrer">Google Calendar</a><button type="button" id="download-calendar">Apple / Outlook · aviso 2 h antes (.ics)</button></div><p class="calendar-note">El archivo incluye un aviso 2 horas antes. En Google Calendar, elige “2 horas antes” en Notificaciones antes de guardar.</p></div><p class="site-link">Conoce más en <a href="https://menopausiadichosa.com/">menopausiadichosa.com</a></p>'+(ticket.checkedInAt?'<div class="arrived">✓ Asistencia registrada</div>':'')+'</div></article><div class="actions"><button id="print">Guardar como PDF</button><button id="share">Compartir boleto</button></div><a class="back" href="/boletos/">← Volver a las sesiones</a></main>';
      if(window.QRCode)new QRCode(root.querySelector('#ticket-qr'),{text:ticket.code,width:160,height:160,correctLevel:QRCode.CorrectLevel.M});
      const [year,month,day]=ticket.date.split('-').map(Number);
      const [hour,minute]=ticket.time.split(':').map(Number);
      const start=new Date(year,month-1,day,hour,minute);
      const end=new Date(start.getTime()+60*60*1000);
      const stamp=value=>[value.getFullYear(),String(value.getMonth()+1).padStart(2,'0'),String(value.getDate()).padStart(2,'0')].join('')+'T'+[value.getHours(),value.getMinutes(),value.getSeconds()].map(part=>String(part).padStart(2,'0')).join('');
      const online=ticket.address==='Evento en línea';const location=online?(ticket.locationUrl||ticket.place):[ticket.place,ticket.address].filter(Boolean).join(', ');
      const details='Presenta tu código '+ticket.code+' al llegar. Más información: https://menopausiadichosa.com/'+(ticket.locationUrl?(online?' Enlace de acceso: ':' Ubicación: ')+ticket.locationUrl:'');
      const google=new URL('https://calendar.google.com/calendar/render');
      google.search=new URLSearchParams({action:'TEMPLATE',text:ticket.title,dates:stamp(start)+'/'+stamp(end),details,location}).toString();
      root.querySelector('#google-calendar').href=google.href;
      root.querySelector('#download-calendar').onclick=()=>{
        const icsEscape=value=>String(value).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
        const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Menopausia Dichosa//Boletos//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+ticket.code+'@menopausiadichosa.com','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),
          'DTSTART:'+stamp(start),'DTEND:'+stamp(end),'SUMMARY:'+icsEscape(ticket.title),'LOCATION:'+icsEscape(location),'DESCRIPTION:'+icsEscape(details),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(online?'Tu evento en línea comienza en 2 horas. Prepara tu acceso.':'Tu sesión comienza en 2 horas. Organiza tu traslado para llegar a tiempo.'),'TRIGGER:-PT2H','END:VALARM','END:VEVENT','END:VCALENDAR'];
        const blob=new Blob([lines.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});
        const href=URL.createObjectURL(blob),link=document.createElement('a');link.href=href;link.download='Menopausia-Dichosa-'+ticket.code+'.ics';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(href),30000);
      };
      root.querySelector('#print').onclick=()=>window.print();
      root.querySelector('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Mi boleto Menopausia Dichosa',url:location.href});else{await navigator.clipboard.writeText(location.href);alert('Enlace copiado')}}catch{}};
    } catch(error) {root.innerHTML='<main class="ticket-page"><p class="error">'+escape(error.message)+'</p><a href="/boletos/">← Volver a las sesiones</a></main>'}
  }
  async function load() {
    const code=new URLSearchParams(location.search).get('boleto');
    if(code){await renderTicket(code);return}
    root.innerHTML='<main class="shell">'+brand('Villanos en la Menopausia')+'<p>Cargando sesiones…</p></main>';
    try {events=await request('/api/events');const requested=new URLSearchParams(location.search).get('evento');selected=events.find(item=>item.id===requested)?.id||events.find(item=>item.active&&item.available>0)?.id||events[0]?.id||'';renderHome()}
    catch(error){root.innerHTML='<main class="shell">'+brand('Villanos en la Menopausia')+'<p class="error">'+escape(error.message)+'</p></main>'}
  }
  addEventListener('popstate',load);load();
})();
</script></body></html>
