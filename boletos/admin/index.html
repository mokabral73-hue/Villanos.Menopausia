.form textarea{display:block;width:100%;border:1px solid #dfc4d2;border-radius:9px;padding:10px;font:inherit;margin-top:8px;resize:vertical;min-height:95px}.save-status{margin:0;padding:12px;border-radius:9px;background:#eef8f0;color:#22573b;font-weight:600;line-height:1.4}.save-status.save-error{background:#fff0f3;color:#a21b3a}.form button:disabled{opacity:.65;cursor:wait}.whatsapp-link{display:inline-block;padding:10px 12px;border:1px solid #bb5c8e;border-radius:8px;color:#902a60;text-decoration:none;font-size:14px;font-weight:600} .attendee .attendee-event{color:#902a60;background:#fff3f8;border-radius:7px;padding:7px 10px;margin:7px 0;font-size:14px;line-height:1.5}.attendee .attendee-event strong{font-size:inherit}.attendees select{display:block;width:100%;height:auto;min-height:46px;border:1px solid #dfc4d2;border-radius:9px;padding:10px 12px;background:#fff;font:inherit;color:#302632;margin-bottom:15px}.event-filter-label{display:block;margin:14px 0 8px;font-weight:600;font-size:14px}.attendee .payment-on-arrival{display:inline-block;color:#1557b0;background:#edf4ff;border:1px solid #1557b0;border-radius:7px;padding:7px 10px;font-weight:700;margin:8px 0;line-height:1.4}.attendee .payment-confirmed{display:inline-block;color:#166534;background:#effaf2;border:1px solid #166534;border-radius:7px;padding:7px 10px;font-weight:700;margin:8px 0;line-height:1.4}
.event-report{margin-bottom:22px}.event-report>p{color:#765b6b;line-height:1.5}.event-counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}.event-count-card{display:block;width:100%;text-align:left;padding:18px;border:1px solid #dfd5df;border-left:7px solid var(--event-color);border-radius:14px;background:#fff;color:#302632;font:inherit;cursor:pointer}.event-count-card[aria-pressed=true]{outline:3px solid var(--event-color);outline-offset:2px}.event-count-card:focus-visible{outline:3px solid #302632;outline-offset:3px}.event-count-card strong{display:block;line-height:1.4}.event-count-card .event-label{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--event-color);margin-bottom:8px}.event-count-card .event-date{display:block;font-size:13px;color:#665568;line-height:1.5;margin-top:6px}.event-count-card .event-total{display:block;font-size:30px;font-weight:800;margin:15px 0 10px;color:var(--event-color)}.event-count-card .event-total small{font-size:14px;font-weight:600}.event-count-card .event-count-detail{display:block;font-size:14px;line-height:1.7;color:#544453}.report-all{margin-top:16px;border:1px solid #b51e68;background:#fff;color:#9a1d5b;padding:10px 15px;border-radius:9px;font:inherit}.attendee[data-event-id]{border-left:5px solid var(--event-color);padding-left:14px;margin-top:10px}.attendee .attendee-event{border-left:3px solid var(--event-color);color:var(--event-color);background:#faf7fb}@media(max-width:760px){.attendee{flex-wrap:wrap}.attendee-actions{justify-content:flex-start}}
.manual-reminder{margin:12px 0;padding:12px;border:1px solid #dfc4d2;border-radius:10px;background:#fff7fa}.manual-reminder strong{font-size:14px!important}.manual-reminder.manual-sent{background:#effaf2;border-color:#93c9a3;color:#166534}.manual-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.manual-actions button{padding:10px;border:1px solid #bb5c8e;border-radius:8px;background:white;color:#902a60;cursor:pointer}.manual-help{font-size:13px;color:#675960;line-height:1.5}</style></head><body><main class="admin"><header class="brand"><img src="/brand-logo.png?v=20261003" alt="Menopausia Dichosa™"><span>Control de sesiones</span></header><h1>Boletos y asistencia</h1><p id="notice" class="error" role="alert" hidden></p><div id="content"></div></main><script src="/boletos/vendor/jsQR.js"></script><script>
(() => {
  'use strict';
  const api='https://boletos-menopausia-dichosa.menopausiadichosa.chatgpt.site';
  const content=document.getElementById('content'),notice=document.getElementById('notice');
  const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  let key=sessionStorage.getItem('md_admin_key')||'', data=null,stream=null,scanning=false,scannerSession=0,scanTimer=null,cameras=[],selectedCamera='',selectedEvent='',attendeeQuery='',manualFilter='';
  const message=text=>{notice.hidden=!text;notice.textContent=text||''};
  async function call(path,options={}) {const headers=new Headers(options.headers||{});headers.set('Authorization','Bearer '+key);const response=await fetch(api+path,{...options,headers});const json=await response.json();if(!response.ok)throw Error(json.error||'No se pudo completar.');return json}
  function stopScanner(){
    scannerSession++;scanning=false;clearTimeout(scanTimer);scanTimer=null;
    if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}
    const box=document.getElementById('scanner');if(box){box.hidden=true;box.querySelector('video').srcObject=null}
    const start=document.getElementById('start-scan');if(start)start.disabled=false
  }
  async function startScanner(deviceId=selectedCamera){
    stopScanner();
    const session=scannerSession,box=document.getElementById('scanner'),video=box.querySelector('video');
    const select=document.getElementById('scan-camera'),change=document.getElementById('change-camera'),note=box.querySelector('.scanner-note');
    box.hidden=false;select.disabled=true;change.disabled=true;document.getElementById('start-scan').disabled=true;
    note.textContent='Abriendo cámara…';
    try{
      if(!navigator.mediaDevices?.getUserMedia)throw Error('La cámara no está disponible. Usa el código manual.');
      const opened=await navigator.mediaDevices.getUserMedia({video:deviceId?{deviceId:{exact:deviceId}}:{facingMode:{ideal:'environment'}},audio:false});
      if(session!==scannerSession){opened.getTracks().forEach(track=>track.stop());return}
      stream=opened;video.srcObject=opened;await video.play();
      if(session!==scannerSession)return;
      selectedCamera=opened.getVideoTracks()[0]?.getSettings?.().deviceId||deviceId||'';
      let devices=[];try{devices=await navigator.mediaDevices.enumerateDevices()}catch{}
      if(session!==scannerSession)return;
      cameras=devices.filter(device=>device.kind==='videoinput');
      select.innerHTML=cameras.map((device,index)=>'<option value="'+safe(device.deviceId)+'">'+safe(device.label||'Cámara '+(index+1))+'</option>').join('');
      select.value=selectedCamera;
      document.getElementById('camera-controls').hidden=cameras.length<2;
      select.disabled=false;change.disabled=false;
      note.textContent=cameras.length===1?'Enfoca el QR del boleto · Solo hay una cámara disponible':'Enfoca el QR del boleto';
      scanning=true;
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
      let detector=null;
      try{if('BarcodeDetector' in window){const formats=await BarcodeDetector.getSupportedFormats();if(session!==scannerSession)return;if(formats.includes('qr_code'))detector=new BarcodeDetector({formats:['qr_code']})}}catch{}
      async function scan(){
        if(!scanning||session!==scannerSession)return;
        let code='';
        if(video.readyState>=2){
          if(detector){try{code=(await detector.detect(video))[0]?.rawValue||''}catch{detector=null}}
          if(!scanning||session!==scannerSession)return;
          if(!code&&window.jsQR&&video.videoWidth&&video.videoHeight){
            canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);
            code=window.jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height)?.data||''
          }
        }
        if(/^MD-[A-F0-9]{8}$/i.test(code)){
          stopScanner();
          try{const result=await call('/api/admin/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});await refresh();message('✓ Llegada registrada: '+result.name+' · '+code)}catch(error){message(error.message)}
          return
        }
        scanTimer=setTimeout(scan,100)
      }
      scan()
    }catch(error){
      if(session!==scannerSession)return;
      stopScanner();
      message(error.name==='NotAllowedError'?'Permite el acceso a la cámara en tu navegador o usa el código manual.':error.name==='NotFoundError'||error.name==='OverconstrainedError'?'Esa cámara ya no está disponible. Vuelve a abrir el lector o usa el código manual.':error.message||'No se pudo abrir la cámara. Usa el código manual.');
      if(error.name==='NotFoundError'||error.name==='OverconstrainedError')selectedCamera=''
    }
  }
  window.addEventListener('pagehide',stopScanner);
  function login(){stopScanner();data=null;content.innerHTML='<form id="login" class="panel compact"><h2>Acceso de organización</h2><label for="admin-password">Clave de acceso</label><input id="admin-password" type="password" name="key" placeholder="Clave de acceso" autocomplete="current-password" required><button id="toggle-password" type="button" aria-controls="admin-password" aria-pressed="false" style="margin-top:8px;padding:10px 12px;border:1px solid #dfc4d2;border-radius:8px;background:#fff;color:#a2175c">Mostrar contraseña</button><button class="primary" type="submit" style="width:100%;margin-top:10px">Entrar</button></form>';document.getElementById('toggle-password').onclick=()=>{const input=document.getElementById('admin-password'),button=document.getElementById('toggle-password'),show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Ocultar contraseña':'Mostrar contraseña';button.setAttribute('aria-pressed',String(show))};document.getElementById('login').onsubmit=async event=>{event.preventDefault();key=new FormData(event.currentTarget).get('key').toString();try{await refresh();sessionStorage.setItem('md_admin_key',key);message('')}catch{key='';message('Clave incorrecta')}}}
  async function refresh(){data=await call('/api/admin/events');try{data.reminders=await call('/api/admin/reminders')}catch{data.reminders=null}render()}
  async function action(path,options){try{await call(path,options);message('');await refresh()}catch(error){message(error.message)}}
  function manualWhatsapp(ticket){if(ticket.paymentStatus!=='confirmed'||(!ticket.paymentReference&&!ticket.whatsappOptIn)||ticket.whatsappStatus==='sent')return '';const event=data.events.find(item=>item.id===ticket.eventId);const digits=ticket.phone.replace(/\D/g,'');const phone=digits.length===10?'52'+digits:digits;const url=api+'/api/ticket/'+encodeURIComponent(ticket.code)+'/share';const msg='Hola '+ticket.name.split(' ')[0]+', tu pago para '+(event?.title||'tu evento')+' está confirmado. Consulta tu boleto aquí: '+url;return '<a class="whatsapp-link" href="https://wa.me/'+encodeURIComponent(phone)+'?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener noreferrer">Enviar WhatsApp manualmente</a>'}
  function accessMode(event){return event?.price_cents?'both':event?.payment_mode==='consumption'||/consumo/i.test(event?.price_note||'')?'consumption':'free'}
  function accessFields(event){const mode=accessMode(event);return '<fieldset class="payment-box"><legend>Acceso y forma de pago</legend><label>Modalidad<select name="paymentMode">'+[['free','Sin costo'],['consumption','Con consumo requerido'],['both','Con costo · pago al llegar o por enlace']].map(option=>'<option value="'+option[0]+'"'+(mode===option[0]?' selected':'')+'>'+option[1]+'</option>').join('')+'</select></label><div data-payment hidden><label>Costo por persona (MXN)<input name="priceMxn" type="number" min="0.01" step="0.01" value="'+(event?.price_cents?safe((event.price_cents/100).toFixed(2)):'')+'" disabled></label><label data-payment-link hidden>Enlace de pago de Mercado Pago <span class="optional">Opcional</span><input name="paymentUrl" type="url" value="'+safe(event?.payment_url||'')+'" placeholder="https://mpago.la/…" disabled></label></div><p class="payment-note" data-payment-note></p></fieldset>'}
  function editForm(event){return '<form class="form edit-form" data-edit-form="'+safe(event.id)+'" hidden><label>Nombre de la sesión<input name="title" value="'+safe(event.title)+'" required></label><div class="fields"><label>Fecha<input type="date" name="date" value="'+safe(event.date)+'" required></label><label>Hora<input type="time" name="time" value="'+safe(event.time)+'" required></label></div><label>Tipo de evento<select name="online"><option value="false"'+(event.address==='Evento en línea'?'':' selected')+'>Presencial</option><option value="true"'+(event.address==='Evento en línea'?' selected':'')+'>En línea (Zoom, live u otra plataforma)</option></select></label><div data-physical><label>Lugar<input name="place" value="'+safe(event.address==='Evento en línea'?'':event.place)+'" required></label><label>Dirección<input name="address" value="'+safe(event.address==='Evento en línea'?'':event.address)+'" required></label></div><div data-online hidden><label>Plataforma<input name="platform" value="'+safe(event.address==='Evento en línea'?event.place:'')+'" placeholder="Zoom, YouTube, Instagram Live…" disabled></label></div><label data-link-label>Enlace de ubicación <span class="optional">Google Maps</span><input type="url" name="locationUrl" value="'+safe(event.location_url||'')+'" placeholder="https://maps.app.goo.gl/…"></label><label>Villano protagonista<input name="villain" value="'+safe(event.villain||'')+'"></label><label>Descripción<textarea name="description" rows="4" maxlength="1200">'+safe(event.description||'')+'</textarea></label><label>Acceso o consumo<input name="priceNote" value="'+safe(event.price_note||'')+'"></label><label>Antes de llegar<input name="arrivalNote" value="'+safe(event.arrival_note||'')+'"></label>'+accessFields(event)+'<label>Cupo<input type="number" name="capacity" value="'+safe(event.capacity)+'" min="1" max="1000" required></label><button type="submit" class="primary">Guardar cambios</button><p class="save-status" data-save-status role="status" hidden></p></form>'}
  function setupMode(form){const selector=form.querySelector('[name=online]'),physical=form.querySelector('[data-physical]'),online=form.querySelector('[data-online]'),link=form.querySelector('[name=locationUrl]'),label=form.querySelector('[data-link-label]');function sync(){const virtual=selector.value==='true';physical.hidden=virtual;online.hidden=!virtual;physical.querySelectorAll('input').forEach(input=>input.disabled=virtual);online.querySelectorAll('input').forEach(input=>input.disabled=!virtual);link.required=virtual;link.placeholder=virtual?'https://zoom.us/j/…':'https://maps.app.goo.gl/…';label.firstChild.textContent=virtual?'Enlace de acceso ':'Enlace de ubicación ';label.querySelector('.optional').textContent=virtual?'Obligatorio · Zoom, live u otra plataforma':'Google Maps'}selector.onchange=sync;sync()}

  function setupPayment(form){const select=form.querySelector('[name=paymentMode]'),box=form.querySelector('[data-payment]'),link=form.querySelector('[data-payment-link]'),note=form.querySelector('[data-payment-note]');function sync(){const mode=select.value,paid=['arrival','link','both'].includes(mode),linked=['link','both'].includes(mode);box.hidden=!paid;link.hidden=!linked;const amount=form.querySelector('[name=priceMxn]'),url=form.querySelector('[name=paymentUrl]');amount.disabled=!paid;amount.required=paid;url.disabled=!linked;url.required=false;note.textContent=mode==='consumption'?'Indica el consumo requerido en «Acceso o consumo». No se cobra una entrada en el registro.':mode==='arrival'?'El asistente reserva, recibe su boleto y paga en recepción. No necesitas enlace.':mode==='both'?'El asistente elige pagar al llegar o por enlace. Si aún no agregas un enlace, podrá pagar al llegar.':mode==='link'?'El boleto se libera cuando se verifica el pago.':'El asistente reserva sin pagar entrada.'}select.onchange=sync;sync()}
  function ticketEvent(ticket){return data.events.find(event=>event.id===ticket.eventId)}
  function eventDescription(event){if(!event)return 'Evento no disponible';const date=/^\d{4}-\d{2}-\d{2}$/.test(event.date||'')?event.date.split('-').reverse().join('/'):event.date;return [event.title,date,event.time,event.place].filter(Boolean).join(' · ')}

  function eventTone(id){const ids=data.events.map(event=>event.id).sort();const index=ids.indexOf(id);const colors=['#7c3aed','#b45309','#0f766e','#be185d','#4338ca','#a33b20','#25647d','#69541a'];return {label:index<0?'Evento':'Evento '+(index+1),color:index<0?'#665568':colors[index%colors.length]}}
  function eventCounts(event){const tickets=data.tickets.filter(ticket=>ticket.eventId===event.id);return {total:tickets.length,confirmed:tickets.filter(ticket=>ticket.paymentStatus==='confirmed').length,arrival:tickets.filter(ticket=>ticket.paymentStatus==='pay_on_arrival').length,pending:tickets.filter(ticket=>ticket.paymentStatus==='pending').length,arrived:tickets.filter(ticket=>ticket.checkedInAt).length}}
  function reminderPanel(){const r=data.reminders;if(!r)return '';const missing=[!r.connected?'conectar WhatsApp Business':'',!r.templateReady?'aprobar y conectar la plantilla de recordatorio':'',!r.enabled?'activar la programación':''].filter(Boolean);const summary=r.summary||{};return '<section class="panel" style="margin-bottom:22px"><h2>Recordatorios por WhatsApp</h2><p>'+safe(missing.length?'Preparados · Falta '+missing.join(', '):'Envíos habilitados · Consulta la programación antes de activar eventos.')+'</p><p class="muted">24 horas y 3 horas antes · Hora de Cancún · Solo personas que autorizaron mensajes · Sin duplicados automáticos</p><p>'+Number(summary.accepted||0)+' aceptados por WhatsApp · '+Number(summary.failed||0)+' rechazados · '+Number(summary.uncertain||0)+' por revisar</p></section>'}
  function eventReport(){return '<section class="panel event-report"><h2>Conteo por evento</h2><p>Totales de registros de cada evento. Toca una tarjeta para ver sus asistentes.</p><div class="event-counts">'+data.events.map(event=>{const tone=eventTone(event.id),counts=eventCounts(event);return '<button type="button" class="event-count-card" data-report-event="'+safe(event.id)+'" style="--event-color:'+tone.color+'" aria-pressed="'+(selectedEvent===event.id)+'"><span class="event-label">'+tone.label+'</span><strong>'+safe(event.title)+'</strong><span class="event-date">'+safe(eventDescription(event))+'</span><span class="event-total">'+counts.total+' <small>registrados de '+safe(event.capacity)+'</small></span><span class="event-count-detail">'+counts.confirmed+' confirmados · '+counts.arrival+' pagan al llegar<br>'+counts.pending+' pagos por verificar · '+counts.arrived+' llegaron</span></button>'}).join('')+'</div><button type="button" class="report-all" id="report-all">Ver todos los eventos · '+data.tickets.length+' registros</button><p class="muted">Los confirmados incluyen accesos sin costo y pagos confirmados. El color de cada evento identifica su tarjeta y sus asistentes; los estados de pago conservan sus colores.</p></section>'}
  function attendeeEvent(ticket){const event=ticketEvent(ticket);return '<span class="attendee-event"><strong>'+eventTone(ticket.eventId).label+':</strong> '+safe(eventDescription(event))+'</span>'}
  function attendeeReferral(ticket){const source={social:'Facebook o Instagram',whatsapp:'WhatsApp',person:'Me invitó una persona',other:'Otro medio'}[ticket.referralSource];return (source?'<small><strong>Se enteró por:</strong> '+safe(source)+'</small>':'')+(ticket.invitedBy?'<small><strong>Invitado por:</strong> '+safe(ticket.invitedBy)+'</small>':'')}

  function manualRecord(ticket){const event=ticketEvent(ticket);return (data.manualReminders||[]).find(record=>record.ticketCode===ticket.code&&record.eventStart===event?.date+'T'+event?.time)}
  function manualState(ticket){const record=manualRecord(ticket);return record?.sentAt?'sent':record?.preparedAt?'prepared':(!ticket.whatsappOptIn||ticket.reminderOptOut||ticket.checkedInAt||ticketEvent(ticket)?.status!=='programado')?'unavailable':'pending'}
  function manualMessage(ticket){
    const event=ticketEvent(ticket),date=String(event.date).split('-').reverse().join('/');
    const lines=['Hola '+ticket.name.split(' ')[0]+' 🌷','Te recordamos tu reserva para '+event.title+'.','📅 '+date+' · '+event.time+' h (hora de Cancún)','📍 '+event.place];
    if(event.address&&event.address!=='Evento en línea')lines.push(event.address);
    if(event.location_url)lines.push(event.location_url);
    lines.push('🎟️ Tu boleto: '+api+'/api/ticket/'+encodeURIComponent(ticket.code)+'/share','¿Nos confirmas tu asistencia respondiendo a este mensaje?','¡Te esperamos! — Menopausia Dichosa');
    return lines.join('\n')
  }
  function manualReminder(ticket){
    const state=manualState(ticket),record=manualRecord(ticket);
    const stamp=value=>new Date(value).toLocaleString('es-MX',{timeZone:'America/Cancun',dateStyle:'short',timeStyle:'short'})+' · Cancún';
    const label=state==='sent'?'✓ Enviado · Confirmado por ti: '+stamp(record.sentAt):state==='prepared'?'Preparado en WhatsApp · Falta confirmar envío':state==='pending'?'Recordatorio pendiente':'Recordatorio no disponible';
    let controls='';
    if(state!=='unavailable'&&ticket.whatsappOptIn&&!ticket.reminderOptOut&&!ticket.checkedInAt&&ticketEvent(ticket)?.status==='programado'){
      let phone=String(ticket.phone).replace(/\D/g,'');if(phone.length===10)phone='52'+phone;if(phone.startsWith('521')&&phone.length===13)phone='52'+phone.slice(3);
      if(/^\d{11,15}$/.test(phone)){
        controls='<a class="whatsapp-link" data-manual-open="'+safe(ticket.code)+'" target="_blank" rel="noopener noreferrer" href="https://wa.me/'+encodeURIComponent(phone)+'?text='+encodeURIComponent(manualMessage(ticket))+'">'+(state==='sent'?'Abrir recordatorio otra vez':state==='prepared'?'Volver a abrir WhatsApp':'Enviar recordatorio')+'</a>';
        if(state==='prepared')controls+='<button type="button" data-manual-sent="'+safe(ticket.code)+'">✓ Ya lo envié</button>'
      }else controls='<small>Revisa el teléfono de esta reserva.</small>'
    }
    if(state==='sent')controls+='<button type="button" data-manual-undo="'+safe(ticket.code)+'">Corregir marca de envío</button>';
    const reason=state==='unavailable'?'<small>'+(!ticket.whatsappOptIn||ticket.reminderOptOut?'Sin autorización para recordatorios por WhatsApp.':ticket.checkedInAt?'Asistencia ya registrada.':'Evento no programado.')+'</small>':'';
    return '<div class="manual-reminder '+(state==='sent'?'manual-sent':'')+'"><strong>'+safe(label)+'</strong>'+reason+'<div class="manual-actions">'+controls+'</div></div>'
  }
  async function recordManual(code,action,button){
    const ticket=data.tickets.find(ticket=>ticket.code===code),event=ticketEvent(ticket);
    if(action==='sent'&&!confirm('¿Ya pulsaste Enviar en WhatsApp para esta persona? Se registrará tu confirmación; WhatsApp no verifica aquí la entrega.'))return;
    if(action==='undo'&&!confirm('¿Quieres quitar la marca de enviado de este recordatorio?'))return;
    if(button?.tagName==='BUTTON')button.disabled=true;
    try{
      const result=await call('/api/admin/manual-reminders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,action,eventStart:event.date+'T'+event.time})});
      data.manualReminders=(data.manualReminders||[]).filter(record=>record.ticketCode!==code||record.eventStart!==result.record.eventStart);
      data.manualReminders.push(result.record);
      const y=window.scrollY;render();window.scrollTo(0,y);
      message(action==='prepared'?'El mensaje está preparado. Pulsa Enviar en WhatsApp y después «Ya lo envié» aquí.':action==='sent'?'Recordatorio marcado como enviado por ti.':'Se quitó la marca de envío.')
    }catch(error){message(error.message);if(button?.tagName==='BUTTON')button.disabled=false}
  }

  function filterAttendees(){content.querySelectorAll('[data-attendee]').forEach(row=>{row.hidden=!!((selectedEvent&&row.dataset.eventId!==selectedEvent)||(attendeeQuery&&!row.dataset.attendee.includes(attendeeQuery))||(manualFilter&&row.dataset.manualState!==manualFilter))});const summary=content.querySelector('#manual-summary');if(summary){const visible=Array.from(content.querySelectorAll('[data-attendee]')).filter(row=>!row.hidden);summary.textContent=visible.length+' reservas mostradas · '+visible.filter(row=>row.dataset.manualState==='sent').length+' con envío confirmado por ti'}content.querySelectorAll('[data-report-event]').forEach(card=>card.setAttribute('aria-pressed',String(card.dataset.reportEvent===selectedEvent)))}
  function render(){stopScanner();if(selectedEvent&&!data.events.some(event=>event.id===selectedEvent))selectedEvent='';content.innerHTML=reminderPanel()+eventReport()+'<div class="grid"><section class="panel"><h2>Crear sesión</h2><form class="form" id="create"><label>Nombre de la sesión<input name="title" value="Villanos en la Menopausia" required></label><div class="fields"><label>Fecha<input name="date" type="date" required></label><label>Hora<input name="time" type="time" required></label></div><label>Tipo de evento<select name="online"><option value="false">Presencial</option><option value="true">En línea (Zoom, live u otra plataforma)</option></select></label><div data-physical><label>Lugar<input name="place" placeholder="Nombre del lugar" required></label><label>Dirección<input name="address" placeholder="Dirección para llegar" required></label></div><div data-online hidden><label>Plataforma<input name="platform" placeholder="Zoom, YouTube, Instagram Live…" disabled></label></div><label data-link-label>Enlace de ubicación <span class="optional">Google Maps</span><input type="url" name="locationUrl" placeholder="https://maps.app.goo.gl/…"></label><label>Imagen promocional <span class="optional">Opcional · JPG, PNG o WebP, máximo 5 MB</span><input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Villano protagonista <span class="optional">Opcional</span><input name="villain" placeholder="Ladrón de Colágeno"></label><label>Descripción de la sesión<textarea name="description" rows="4" maxlength="1200" placeholder="¿Qué descubrirán?"></textarea></label><label>Acceso o consumo <span class="optional">Opcional</span><input name="priceNote" placeholder="Sin costo, solo consumo"></label><label>Antes de llegar <span class="optional">Opcional</span><input name="arrivalNote" placeholder="Llega antes para pedir tu bebida favorita"></label>'+accessFields(null)+'<label>Cupo<input name="capacity" type="number" value="20" min="1" max="1000" required></label><button class="primary" type="submit">Crear sesión</button></form></section><section class="panel"><h2>Registrar llegada</h2><p>Escribe el código del boleto que te muestren.</p><button type="button" class="primary" id="start-scan">📷 Escanear boleto</button><div class="scanner" id="scanner" hidden><video playsinline muted autoplay></video><p class="scanner-note">Enfoca el QR del boleto</p><div id="camera-controls" hidden><label for="scan-camera">Cámara</label><select id="scan-camera" aria-label="Seleccionar cámara"></select><button type="button" id="change-camera">🔄 Cambiar cámara</button></div><button type="button" id="stop-scan">Cerrar cámara</button></div><form class="check" id="check"><input name="code" placeholder="MD-XXXXXXXX" required><button class="primary" type="submit">Registrar</button></form><div class="summaries">'+data.events.map(event=>{const tickets=data.tickets.filter(t=>t.eventId===event.id);return '<div class="summary" data-id="'+safe(event.id)+'">'+(event.image_key?'<img src="'+api+'/api/events/'+encodeURIComponent(event.id)+'/image" alt="Promocional de '+safe(event.title)+'">':'')+'<strong>'+safe(event.title)+' · '+safe(event.date)+'</strong>'+(event.price_cents?'<p>Acceso: $'+(event.price_cents/100).toFixed(2)+' MXN · '+safe({arrival:'pago al llegar',link:'pago mediante enlace',both:'pago al llegar o mediante enlace'}[accessMode(event)]||'')+'</p>':'')+'<p>'+tickets.length+' reservadas · '+tickets.filter(t=>t.checkedInAt).length+' llegaron · '+event.available+' lugares libres</p>'+(event.location_url?'<p><a href="'+safe(event.location_url)+'" target="_blank" rel="noopener noreferrer">'+(event.address==='Evento en línea'?'Abrir acceso en línea':'Abrir ubicación')+'</a></p>':'')+'<button type="button" data-edit="'+safe(event.id)+'">Editar sesión</button>'+editForm(event)+'<form class="attach" data-attach="'+safe(event.id)+'"><label>Imagen de esta sesión<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label><button type="submit">Guardar imagen</button></form>'+(event.active?'':'')+(true?'<button class="delete" data-delete="'+safe(event.id)+'">Borrar evento</button>':'')+'<button data-toggle="'+safe(event.id)+'">'+(event.active?'Cerrar reservas':'Abrir reservas')+'</button><button data-copy="'+safe(event.id)+'">Copiar enlace de este evento</button></div>'}).join('')+'</div></section></div><section class="panel attendees"><h2>Lista de asistentes</h2><label for="attendee-search">Buscar por nombre, código, invitador o evento</label><input id="attendee-search" type="search" placeholder="Nombre, MD-XXXXXXXX o evento" autocomplete="off" value="'+safe(attendeeQuery)+'"><label for="attendee-event-filter" class="event-filter-label">Mostrar asistentes de</label><select id="attendee-event-filter"><option value="">Todos los eventos</option>'+data.events.map(event=>'<option value="'+safe(event.id)+'"'+(selectedEvent===event.id?' selected':'')+'>'+safe(eventDescription(event))+'</option>').join('')+'</select><label for="manual-filter" class="event-filter-label">Recordatorios por WhatsApp</label><select id="manual-filter"><option value="">Todos los estados</option><option value="pending">Pendientes de abrir</option><option value="prepared">Preparados · falta confirmar envío</option><option value="sent">Enviados · confirmados por mí</option><option value="unavailable">No disponibles</option></select><p class="scanner-note" id="manual-summary" aria-live="polite"></p><p class="manual-help">Abrir WhatsApp prepara el mensaje. Después de enviarlo, pulsa «Ya lo envié» para guardar el control. No confirma entrega ni lectura.</p>'+(data.tickets.length?data.tickets.map(ticket=>'<div class="attendee" style="--event-color:'+eventTone(ticket.eventId).color+'" data-attendee="'+safe((ticket.name+' '+ticket.code+' '+(ticket.invitedBy||'')+' '+eventDescription(ticketEvent(ticket))).toLowerCase())+'" data-event-id="'+safe(ticket.eventId)+'" data-manual-state="'+manualState(ticket)+'"><div><strong>'+safe(ticket.name)+'</strong>'+attendeeEvent(ticket)+attendeeReferral(ticket)+manualReminder(ticket)+'<span>'+safe(ticket.phone)+' · '+safe(ticket.code)+'</span><small>'+safe(ticket.concern)+'</small>'+(ticket.paymentStatus==='pay_on_arrival'?'<span class="payment-on-arrival">Sin pagar · Pago al llegar</span>':ticket.paymentStatus==='pending'?'<span class="payment-pending">'+(ticket.mercadoPagoPreferenceId?'Mercado Pago: esperando acreditación automática':('Pago por verificar · '+(ticket.paymentReference?'datos: '+safe(ticket.paymentReference):'busca su comprobante en WhatsApp con el código '+safe(ticket.code))))+'</span>':(ticket.paymentStatus==='confirmed'&&Number(ticketEvent(ticket)?.price_cents)>0)?'<span class="payment-confirmed">Pago confirmado</span>'+(ticket.whatsappOptIn?(ticket.whatsappStatus==='sent'?'<small>Confirmación por WhatsApp enviada</small>':'<small>WhatsApp: '+(ticket.whatsappStatus==='setup_needed'?'falta conectar la cuenta':ticket.whatsappStatus==='failed'?'envío fallido':'envío pendiente')+'</small>'):'<small>Reserva anterior: sin autorización de envío automático</small>'):'')+'</div><div class="attendee-actions">'+(['pending','pay_on_arrival'].includes(ticket.paymentStatus)&&!ticket.mercadoPagoPreferenceId?'<button data-confirm-payment="'+safe(ticket.code)+'">'+(ticket.paymentStatus==='pay_on_arrival'?'Registrar pago recibido':'Confirmar pago')+'</button>':'')+(ticket.paymentStatus==='confirmed'&&ticket.whatsappOptIn&&ticket.whatsappStatus!=='sent'?'<button data-retry-whatsapp="'+safe(ticket.code)+'">Reintentar WhatsApp</button>':'')+manualWhatsapp(ticket)+'<button data-arrival="'+safe(ticket.code)+'" '+(ticket.checkedInAt?'disabled':'')+'>'+(ticket.checkedInAt?'✓ Llegó':'Marcar llegada')+'</button>'+((ticket.checkedInAt||ticket.mercadoPagoPreferenceId)?'':'<button class="cancel" data-cancel="'+safe(ticket.code)+'">Eliminar reserva</button>')+'</div></div>').join(''):'<p>Las reservas aparecerán aquí.</p>')+'</section>';
    setupMode(document.getElementById('create'));setupPayment(document.getElementById('create'));content.querySelectorAll('[data-edit-form]').forEach(form=>{setupMode(form);setupPayment(form)});document.getElementById('create').onsubmit=async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;await action('/api/admin/events',{method:'POST',body:new FormData(e.currentTarget)});button.disabled=false};

    content.querySelector('#manual-filter').value=manualFilter;
    content.querySelector('#manual-filter').onchange=e=>{manualFilter=e.target.value;filterAttendees()};
    content.querySelectorAll('[data-manual-open]').forEach(link=>link.onclick=()=>{recordManual(link.dataset.manualOpen,'prepared',link)});
    content.querySelectorAll('[data-manual-sent]').forEach(button=>button.onclick=()=>recordManual(button.dataset.manualSent,'sent',button));
    content.querySelectorAll('[data-manual-undo]').forEach(button=>button.onclick=()=>recordManual(button.dataset.manualUndo,'undo',button));

    document.getElementById('start-scan').onclick=()=>startScanner();document.getElementById('scan-camera').onchange=e=>startScanner(e.target.value);document.getElementById('change-camera').onclick=()=>{const index=cameras.findIndex(camera=>camera.deviceId===selectedCamera);if(cameras.length>1)startScanner(cameras[(index+1)%cameras.length].deviceId)};document.getElementById('stop-scan').onclick=stopScanner;document.getElementById('check').onsubmit=e=>{e.preventDefault();const code=new FormData(e.currentTarget).get('code');check(code)};
    content.querySelectorAll('[data-report-event]').forEach(card=>card.onclick=()=>{selectedEvent=card.dataset.reportEvent;content.querySelector('#attendee-event-filter').value=selectedEvent;filterAttendees();content.querySelector('.attendees').scrollIntoView({behavior:'smooth',block:'start'})});content.querySelector('#report-all').onclick=()=>{selectedEvent='';attendeeQuery='';content.querySelector('#attendee-event-filter').value='';content.querySelector('#attendee-search').value='';filterAttendees();content.querySelector('.attendees').scrollIntoView({behavior:'smooth',block:'start'})};
    content.querySelector('#attendee-search').oninput=e=>{attendeeQuery=e.target.value.trim().toLowerCase();filterAttendees()};content.querySelector('#attendee-event-filter').onchange=e=>{selectedEvent=e.target.value;filterAttendees()};filterAttendees();content.querySelectorAll('[data-arrival]').forEach(b=>b.onclick=()=>check(b.dataset.arrival));content.querySelectorAll('[data-confirm-payment]').forEach(b=>b.onclick=()=>{const ticket=data.tickets.find(item=>item.code===b.dataset.confirmPayment);const question=ticket?.paymentStatus==='pay_on_arrival'?'¿Ya recibiste el pago de esta reserva en recepción? Se marcará como pagado.':'Confirma únicamente si el pago aparece acreditado en Mercado Pago y corresponde al evento y código de esta reserva. ¿Ya lo verificaste?';if(confirm(question)){b.disabled=true;call('/api/admin/tickets',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:b.dataset.confirmPayment})}).then(result=>{refresh();message(result.whatsappStatus==='sent'?'Pago confirmado. Se envió el WhatsApp.':result.whatsappStatus==='setup_needed'?'Pago confirmado. Falta conectar WhatsApp Business para el aviso automático.':'Pago confirmado. El aviso por WhatsApp está pendiente; revisa su estado en la lista.')}).catch(error=>{message(error.message);b.disabled=false})}});
    content.querySelectorAll('[data-retry-whatsapp]').forEach(button=>button.onclick=async()=>{button.disabled=true;try{const result=await call('/api/admin/tickets',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:button.dataset.retryWhatsapp,resend:true})});await refresh();message(result.whatsappStatus==='sent'?'Confirmación enviada por WhatsApp.':result.whatsappStatus==='setup_needed'?'Falta conectar WhatsApp Business para el envío automático.':'No se pudo enviar; revisa la cuenta y vuelve a intentarlo.')}catch(error){message(error.message);button.disabled=false}});
    content.querySelectorAll('[data-cancel]').forEach(button=>button.onclick=()=>{
      const ticket=data.tickets.find(item=>item.code===button.dataset.cancel);
      const event=data.events.find(item=>item.id===ticket.eventId);
      if(confirm('¿Eliminar la reserva de '+ticket.name+' para '+(event?.title||'esta sesión')+' ('+ticket.code+')? Su boleto dejará de funcionar y el lugar quedará disponible.')){
        action('/api/admin/tickets',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:ticket.code})});
      }
    });
    content.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>{const form=content.querySelector('[data-edit-form="'+button.dataset.edit+'"]');form.hidden=!form.hidden;button.textContent=form.hidden?'Editar sesión':'Cancelar edición'});
    content.querySelectorAll('[data-edit-form]').forEach(form=>{form.addEventListener('invalid',e=>{const field=e.target,label=field.closest('label'),name=label?.firstChild?.textContent?.trim()||field.name,status=form.querySelector('[data-save-status]');status.hidden=false;status.classList.add('save-error');status.textContent='Revisa «'+name+'»: '+field.validationMessage},true);form.onsubmit=async e=>{e.preventDefault();const fields=Object.fromEntries(new FormData(form)),button=form.querySelector('[type=submit]'),status=form.querySelector('[data-save-status]');button.disabled=true;status.hidden=false;status.classList.remove('save-error');status.textContent='Guardando cambios…';try{await call('/api/admin/events',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({...fields,id:form.dataset.editForm,capacity:Number(fields.capacity)})});await refresh();message('Cambios guardados.');const updated=content.querySelector('[data-edit-form="'+form.dataset.editForm+'"]');if(updated){updated.hidden=false;const feedback=updated.querySelector('[data-save-status]');feedback.hidden=false;feedback.textContent='Cambios guardados.';content.querySelector('[data-edit="'+form.dataset.editForm+'"]').textContent='Cancelar edición'}}catch(error){status.classList.add('save-error');status.textContent=error.message;message(error.message)}finally{button.disabled=false}}});
    content.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const event=data.events.find(item=>item.id===b.dataset.toggle);action('/api/admin/events',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:event.id,active:!event.active})})});
    content.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Borrar este evento del listado y cerrar sus reservas? Los boletos existentes se conservarán.'))action('/api/admin/events',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.delete})})});
    content.querySelectorAll('[data-attach]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const fields=new FormData(form);fields.set('eventId',form.dataset.attach);action('/api/admin/image',{method:'POST',body:fields})});
    content.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(api+'/api/events/'+encodeURIComponent(b.dataset.copy)+'/share');alert('Enlace del evento copiado. Compártelo en WhatsApp para mostrar su imagen.')});
  }
  function check(code){action('/api/admin/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:String(code).trim().toUpperCase()})})}
  if(key)refresh().catch(()=>{sessionStorage.removeItem('md_admin_key');key='';login()});else login();
})();
</script></body></html>
