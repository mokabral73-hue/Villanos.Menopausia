<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Boletos y asistencia | Menopausia Dichosa®</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffafc;color:#302632;font:16px Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}.admin{max-width:1140px;margin:auto;padding:28px 24px}.brand{display:flex;align-items:center;gap:20px;color:#765b6b}.brand img{width:170px;height:auto}.admin h1{font:normal 44px Georgia,serif;margin:55px 0 28px}.panel{background:#fff;border:1px solid #efd7e2;box-shadow:0 20px 55px #74204b12;border-radius:22px;padding:30px}.panel h2{font:normal 30px Georgia,serif;margin:0 0 22px}.compact{max-width:420px}.grid,.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.form{display:grid;gap:14px}.form label{font-weight:600;font-size:14px}.form input{display:block;margin-top:8px}.field{min-width:0}input{width:100%;height:46px;border:1px solid #dfc4d2;border-radius:9px;padding:10px 12px;background:#fff}input[type=file]{height:auto}.primary{background:#b51e68;color:#fff;border:0;border-radius:8px;padding:13px 18px}.form .primary{width:100%}.optional{font-weight:normal;color:#897484}.check{display:flex;gap:8px}.check input{flex:1}.check button{padding:0 20px}.summary{border-top:1px solid #eedce6;padding:15px 0}.summary p{color:#755f6d;font-size:14px}.summary img{display:block;width:100%;max-width:280px;max-height:300px;object-fit:contain;border-radius:9px;margin-bottom:10px}[hidden]{display:none!important}.edit-form{border:1px solid #efd7e2;border-radius:12px;padding:16px;margin:12px 0}.edit-form .primary{color:#fff;background:#b51e68;border-radius:8px;padding:12px}.summary button{background:none;border:0;color:#a21d63;padding:5px 10px 5px 0}.summary .delete{color:#a32745;text-decoration:underline;font-weight:600}.attach{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.attach label{flex:1;min-width:180px;font-size:14px;font-weight:600}.attach input{display:block;margin-top:8px;font-size:13px}.attendees{margin-top:22px}.attendee{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #efdee6;padding:14px 0;gap:12px}.attendee span,.attendee small{display:block;color:#75606d;margin-top:4px}.attendee button{padding:10px;border:1px solid #ca6a99;border-radius:8px;background:#fff;color:#a21d63;white-space:nowrap}.attendee-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.attendee .cancel{border:0;background:none;color:#a32745;text-decoration:underline;font-size:14px}.attendee .cancel:disabled{display:none}.error{color:#a21b3a;background:#fff0f3;padding:12px;border-radius:9px}.muted{color:#765b6b;font-size:14px}@media(max-width:760px){.grid,.fields{grid-template-columns:1fr}.admin{padding:18px}.admin h1{margin:35px 0 20px}.panel{padding:21px}.brand img{width:132px}.check{flex-wrap:wrap}}
[hidden]{display:none!important} .scanner{margin:16px 0;padding:14px;border:1px solid #efd7e2;border-radius:12px;background:#fff7fa}.scanner video{display:block;width:100%;max-width:390px;max-height:340px;object-fit:cover;border-radius:10px}.scanner button{margin-top:10px;padding:10px 14px}.scanner-note{font-weight:600;color:#763458}
.payment-box{border:1px solid #e3a5c3;background:#fff5fa;border-radius:12px;padding:15px;margin:12px 0}.payment-box label{margin:8px 0}.payment-note{font-size:13px;color:#795669;line-height:1.45}.payment-pending{display:block;color:#99285e;font-weight:700;margin:8px 0}.payment-confirmed{display:block;color:#276143;font-weight:700;margin:8px 0}
.form textarea{display:block;width:100%;border:1px solid #dfc4d2;border-radius:9px;padding:10px;font:inherit;margin-top:8px;resize:vertical;min-height:95px}.save-status{margin:0;padding:12px;border-radius:9px;background:#eef8f0;color:#22573b;font-weight:600;line-height:1.4}.save-status.save-error{background:#fff0f3;color:#a21b3a}.form button:disabled{opacity:.65;cursor:wait}</style></head><body><main class="admin"><header class="brand"><img src="/brand-logo.png" alt="Menopausia Dichosa®"><span>Control de sesiones</span></header><h1>Boletos y asistencia</h1><p id="notice" class="error" role="alert" hidden></p><div id="content"></div></main><script src="/boletos/vendor/jsQR.js"></script><script>
(() => {
  'use strict';
  const api='https://boletos-menopausia-dichosa.menopausiadichosa.chatgpt.site';
  const content=document.getElementById('content'),notice=document.getElementById('notice');
  const safe=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  let key=sessionStorage.getItem('md_admin_key')||'', data=null,stream=null,scanning=false;
  const message=text=>{notice.hidden=!text;notice.textContent=text||''};
  async function call(path,options={}) {const headers=new Headers(options.headers||{});headers.set('Authorization','Bearer '+key);const response=await fetch(api+path,{...options,headers});const json=await response.json();if(!response.ok)throw Error(json.error||'No se pudo completar.');return json}
  function stopScanner(){scanning=false;if(stream){stream.getTracks().forEach(track=>track.stop());stream=null}const box=document.getElementById('scanner');if(box)box.hidden=true}
  async function startScanner(){const box=document.getElementById('scanner'),video=box.querySelector('video');box.hidden=false;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('La cámara no está disponible. Usa el código manual.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;await video.play();scanning=true;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});let detector=null;try{if('BarcodeDetector' in window){const formats=await BarcodeDetector.getSupportedFormats();if(formats.includes('qr_code'))detector=new BarcodeDetector({formats:['qr_code']})}}catch{}async function scan(){if(!scanning)return;let code='';if(video.readyState>=2){if(detector){try{code=(await detector.detect(video))[0]?.rawValue||''}catch{detector=null}}if(!code&&window.jsQR){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0);code=window.jsQR(ctx.getImageData(0,0,canvas.width,canvas.height).data,canvas.width,canvas.height)?.data||''}}if(/^MD-[A-F0-9]{8}$/i.test(code)){stopScanner();try{const result=await call('/api/admin/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});await refresh();message('✓ Llegada registrada: '+result.name+' · '+code)}catch(error){message(error.message)}return}setTimeout(scan,100)}scan()}catch(error){stopScanner();message(error.message||'No se pudo abrir la cámara. Usa el código manual.')}}
  function login(){data=null;content.innerHTML='<form id="login" class="panel compact"><h2>Acceso de organización</h2><input type="password" name="key" placeholder="Clave de acceso" autocomplete="current-password" required><button class="primary" type="submit" style="width:100%;margin-top:10px">Entrar</button></form>';document.getElementById('login').onsubmit=async event=>{event.preventDefault();key=new FormData(event.currentTarget).get('key').toString();try{await refresh();sessionStorage.setItem('md_admin_key',key);message('')}catch{key='';message('Clave incorrecta')}}}
  async function refresh(){data=await call('/api/admin/events');render()}
  async function action(path,options){try{await call(path,options);message('');await refresh()}catch(error){message(error.message)}}
  function editForm(event){return '<form class="form edit-form" data-edit-form="'+safe(event.id)+'" hidden><label>Nombre de la sesión<input name="title" value="'+safe(event.title)+'" required></label><div class="fields"><label>Fecha<input type="date" name="date" value="'+safe(event.date)+'" required></label><label>Hora<input type="time" name="time" value="'+safe(event.time)+'" required></label></div><label>Tipo de evento<select name="online"><option value="false"'+(event.address==='Evento en línea'?'':' selected')+'>Presencial</option><option value="true"'+(event.address==='Evento en línea'?' selected':'')+'>En línea (Zoom, live u otra plataforma)</option></select></label><div data-physical><label>Lugar<input name="place" value="'+safe(event.address==='Evento en línea'?'':event.place)+'" required></label><label>Dirección<input name="address" value="'+safe(event.address==='Evento en línea'?'':event.address)+'" required></label></div><div data-online hidden><label>Plataforma<input name="platform" value="'+safe(event.address==='Evento en línea'?event.place:'')+'" placeholder="Zoom, YouTube, Instagram Live…" disabled></label></div><label data-link-label>Enlace de ubicación <span class="optional">Google Maps</span><input type="url" name="locationUrl" value="'+safe(event.location_url||'')+'" placeholder="https://maps.app.goo.gl/…"></label><label>Villano protagonista<input name="villain" value="'+safe(event.villain||'')+'"></label><label>Descripción<textarea name="description" rows="4" maxlength="1200">'+safe(event.description||'')+'</textarea></label><label>Acceso o consumo<input name="priceNote" value="'+safe(event.price_note||'')+'"></label><label>Antes de llegar<input name="arrivalNote" value="'+safe(event.arrival_note||'')+'"></label><fieldset class="payment-box"><legend>Acceso al evento</legend><label>¿Tiene costo?<select name="paid"><option value="false"'+(event.price_cents?'':' selected')+'>Sin costo</option><option value="true"'+(event.price_cents?' selected':'')+'>Con costo · Mercado Pago</option></select></label><div data-payment hidden><label>Costo por persona (MXN)<input name="priceMxn" type="number" min="0.01" step="0.01" value="'+(event.price_cents?safe((event.price_cents/100).toFixed(2)):'')+'" disabled></label><label>Link de pago de Mercado Pago<input name="paymentUrl" type="url" value="'+safe(event.payment_url||'')+'" placeholder="https://mpago.la/…" disabled></label><p class="payment-note">Confirma cada pago en Mercado Pago antes de liberar el boleto.</p></div></fieldset><label>Cupo<input type="number" name="capacity" value="'+safe(event.capacity)+'" min="1" max="1000" required></label><button type="submit" class="primary">Guardar cambios</button><p class="save-status" data-save-status role="status" hidden></p></form>'}
  function setupMode(form){const selector=form.querySelector('[name=online]'),physical=form.querySelector('[data-physical]'),online=form.querySelector('[data-online]'),link=form.querySelector('[name=locationUrl]'),label=form.querySelector('[data-link-label]');function sync(){const virtual=selector.value==='true';physical.hidden=virtual;online.hidden=!virtual;physical.querySelectorAll('input').forEach(input=>input.disabled=virtual);online.querySelectorAll('input').forEach(input=>input.disabled=!virtual);link.required=virtual;link.placeholder=virtual?'https://zoom.us/j/…':'https://maps.app.goo.gl/…';label.firstChild.textContent=virtual?'Enlace de acceso ':'Enlace de ubicación ';label.querySelector('.optional').textContent=virtual?'Obligatorio · Zoom, live u otra plataforma':'Google Maps'}selector.onchange=sync;sync()}

  function setupPayment(form){const select=form.querySelector('[name=paid]'),box=form.querySelector('[data-payment]');function sync(){const paid=select.value==='true';box.hidden=!paid;box.querySelectorAll('input').forEach(input=>{input.disabled=!paid;input.required=paid})}select.onchange=sync;sync()}
  function render(){content.innerHTML='<div class="grid"><section class="panel"><h2>Crear sesión</h2><form class="form" id="create"><label>Nombre de la sesión<input name="title" value="Villanos en la Menopausia" required></label><div class="fields"><label>Fecha<input name="date" type="date" required></label><label>Hora<input name="time" type="time" required></label></div><label>Tipo de evento<select name="online"><option value="false">Presencial</option><option value="true">En línea (Zoom, live u otra plataforma)</option></select></label><div data-physical><label>Lugar<input name="place" placeholder="Nombre del lugar" required></label><label>Dirección<input name="address" placeholder="Dirección para llegar" required></label></div><div data-online hidden><label>Plataforma<input name="platform" placeholder="Zoom, YouTube, Instagram Live…" disabled></label></div><label data-link-label>Enlace de ubicación <span class="optional">Google Maps</span><input type="url" name="locationUrl" placeholder="https://maps.app.goo.gl/…"></label><label>Imagen promocional <span class="optional">Opcional · JPG, PNG o WebP, máximo 5 MB</span><input name="image" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Villano protagonista <span class="optional">Opcional</span><input name="villain" placeholder="Ladrón de Colágeno"></label><label>Descripción de la sesión<textarea name="description" rows="4" maxlength="1200" placeholder="¿Qué descubrirán?"></textarea></label><label>Acceso o consumo <span class="optional">Opcional</span><input name="priceNote" placeholder="Sin costo, solo consumo"></label><label>Antes de llegar <span class="optional">Opcional</span><input name="arrivalNote" placeholder="Llega antes para pedir tu bebida favorita"></label><fieldset class="payment-box"><legend>Acceso al evento</legend><label>¿Tiene costo?<select name="paid"><option value="false">Sin costo</option><option value="true">Con costo · Mercado Pago</option></select></label><div data-payment hidden><label>Costo por persona (MXN)<input name="priceMxn" type="number" min="0.01" step="0.01" placeholder="Ej. 250.00" disabled></label><label>Link de pago de Mercado Pago<input name="paymentUrl" type="url" placeholder="https://mpago.la/…" disabled></label><p class="payment-note">Confirma cada pago en Mercado Pago antes de liberar el boleto.</p></div></fieldset><label>Cupo<input name="capacity" type="number" value="20" min="1" max="1000" required></label><button class="primary" type="submit">Crear sesión</button></form></section><section class="panel"><h2>Registrar llegada</h2><p>Escribe el código del boleto que te muestren.</p><button type="button" class="primary" id="start-scan">📷 Escanear boleto</button><div class="scanner" id="scanner" hidden><video playsinline muted autoplay></video><p class="scanner-note">Enfoca el QR del boleto</p><button type="button" id="stop-scan">Cerrar cámara</button></div><form class="check" id="check"><input name="code" placeholder="MD-XXXXXXXX" required><button class="primary" type="submit">Registrar</button></form><div class="summaries">'+data.events.map(event=>{const tickets=data.tickets.filter(t=>t.eventId===event.id);return '<div class="summary" data-id="'+safe(event.id)+'">'+(event.image_key?'<img src="'+api+'/api/events/'+encodeURIComponent(event.id)+'/image" alt="Promocional de '+safe(event.title)+'">':'')+'<strong>'+safe(event.title)+' · '+safe(event.date)+'</strong>'+(event.price_cents?'<p>Acceso: $'+(event.price_cents/100).toFixed(2)+' MXN · pago con Mercado Pago</p>':'')+'<p>'+tickets.length+' reservadas · '+tickets.filter(t=>t.checkedInAt).length+' llegaron · '+event.available+' lugares libres</p>'+(event.location_url?'<p><a href="'+safe(event.location_url)+'" target="_blank" rel="noopener noreferrer">'+(event.address==='Evento en línea'?'Abrir acceso en línea':'Abrir ubicación')+'</a></p>':'')+'<button type="button" data-edit="'+safe(event.id)+'">Editar sesión</button>'+editForm(event)+'<form class="attach" data-attach="'+safe(event.id)+'"><label>Imagen de esta sesión<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label><button type="submit">Guardar imagen</button></form>'+(event.active?'':'')+(!event.active&&!tickets.length?'<button class="delete" data-delete="'+safe(event.id)+'">Eliminar sesión</button>':'')+'<button data-toggle="'+safe(event.id)+'">'+(event.active?'Cerrar reservas':'Abrir reservas')+'</button><button data-copy="'+safe(event.id)+'">Copiar enlace de este evento</button></div>'}).join('')+'</div></section></div><section class="panel attendees"><h2>Lista de asistentes</h2><label for="attendee-search">Buscar por nombre o código</label><input id="attendee-search" type="search" placeholder="Nombre o MD-XXXXXXXX" autocomplete="off">'+(data.tickets.length?data.tickets.map(ticket=>'<div class="attendee" data-attendee="'+safe((ticket.name+' '+ticket.code).toLowerCase())+'"><div><strong>'+safe(ticket.name)+'</strong><span>'+safe(ticket.phone)+' · '+safe(ticket.code)+'</span><small>'+safe(ticket.concern)+'</small>'+(ticket.paymentStatus==='pending'?'<span class="payment-pending">Pago por verificar · '+(ticket.paymentReference?'referencia: '+safe(ticket.paymentReference):'falta la referencia de la participante')+'</span>':ticket.paymentReference?'<span class="payment-confirmed">Pago confirmado</span>':'')+'</div><div class="attendee-actions">'+(ticket.paymentStatus==='pending'&&ticket.paymentReference?'<button data-confirm-payment="'+safe(ticket.code)+'">Confirmar pago</button>':'')+'<button data-arrival="'+safe(ticket.code)+'" '+(ticket.checkedInAt?'disabled':'')+'>'+(ticket.checkedInAt?'✓ Llegó':'Marcar llegada')+'</button>'+(ticket.checkedInAt?'':'<button class="cancel" data-cancel="'+safe(ticket.code)+'">Eliminar reserva</button>')+'</div></div>').join(''):'<p>Las reservas aparecerán aquí.</p>')+'</section>';
    setupMode(document.getElementById('create'));setupPayment(document.getElementById('create'));content.querySelectorAll('[data-edit-form]').forEach(form=>{setupMode(form);setupPayment(form)});document.getElementById('create').onsubmit=async e=>{e.preventDefault();const button=e.currentTarget.querySelector('button');button.disabled=true;await action('/api/admin/events',{method:'POST',body:new FormData(e.currentTarget)});button.disabled=false};
    document.getElementById('start-scan').onclick=startScanner;document.getElementById('stop-scan').onclick=stopScanner;document.getElementById('check').onsubmit=e=>{e.preventDefault();const code=new FormData(e.currentTarget).get('code');check(code)};
    content.querySelector('#attendee-search').oninput=e=>{const q=e.target.value.trim().toLowerCase();content.querySelectorAll('[data-attendee]').forEach(row=>row.hidden=!row.dataset.attendee.includes(q))};content.querySelectorAll('[data-arrival]').forEach(b=>b.onclick=()=>check(b.dataset.arrival));content.querySelectorAll('[data-confirm-payment]').forEach(b=>b.onclick=()=>{if(confirm('¿Ya verificaste este pago en tu cuenta de Mercado Pago?'))action('/api/admin/tickets',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:b.dataset.confirmPayment})})});
    content.querySelectorAll('[data-cancel]').forEach(button=>button.onclick=()=>{
      const ticket=data.tickets.find(item=>item.code===button.dataset.cancel);
      const event=data.events.find(item=>item.id===ticket.eventId);
      if(confirm('¿Eliminar la reserva de '+ticket.name+' para '+(event?.title||'esta sesión')+' ('+ticket.code+')? Su boleto dejará de funcionar y el lugar quedará disponible.')){
        action('/api/admin/tickets',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:ticket.code})});
      }
    });
    content.querySelectorAll('[data-edit]').forEach(button=>button.onclick=()=>{const form=content.querySelector('[data-edit-form="'+button.dataset.edit+'"]');form.hidden=!form.hidden;button.textContent=form.hidden?'Editar sesión':'Cancelar edición'});
    content.querySelectorAll('[data-edit-form]').forEach(form=>{form.addEventListener('invalid',e=>{const field=e.target,label=field.closest('label'),name=label?.firstChild?.textContent?.trim()||field.name,status=form.querySelector('[data-save-status]');status.hidden=false;status.classList.add('save-error');status.textContent='Revisa «'+name+'»: '+field.validationMessage},true);form.onsubmit=async e=>{e.preventDefault();const fields=Object.fromEntries(new FormData(form)),button=form.querySelector('[type=submit]'),status=form.querySelector('[data-save-status]');button.disabled=true;status.hidden=false;status.classList.remove('save-error');status.textContent='Guardando cambios…';try{await call('/api/admin/events',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({...fields,id:form.dataset.editForm,capacity:Number(fields.capacity)})});await refresh();message('Cambios guardados.');const updated=content.querySelector('[data-edit-form="'+form.dataset.editForm+'"]');if(updated){updated.hidden=false;const feedback=updated.querySelector('[data-save-status]');feedback.hidden=false;feedback.textContent='Cambios guardados.';content.querySelector('[data-edit="'+form.dataset.editForm+'"]').textContent='Cancelar edición'}}catch(error){status.classList.add('save-error');status.textContent=error.message;message(error.message)}finally{button.disabled=false}}});
    content.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const event=data.events.find(item=>item.id===b.dataset.toggle);action('/api/admin/events',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:event.id,active:!event.active})})});
    content.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar esta sesión cerrada? Esta acción no se puede deshacer.'))action('/api/admin/events',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.delete})})});
    content.querySelectorAll('[data-attach]').forEach(form=>form.onsubmit=e=>{e.preventDefault();const fields=new FormData(form);fields.set('eventId',form.dataset.attach);action('/api/admin/image',{method:'POST',body:fields})});
    content.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText('https://menopausiadichosa.com/boletos/?evento='+encodeURIComponent(b.dataset.copy));alert('Enlace copiado')});
  }
  function check(code){action('/api/admin/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:String(code).trim().toUpperCase()})})}
  if(key)refresh().catch(()=>{sessionStorage.removeItem('md_admin_key');key='';login()});else login();
})();
</script></body></html>
